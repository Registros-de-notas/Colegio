        function mostrarTodosLosPagos() {
            cargarTodosLosPagos();
        }

        function cargarTodosLosPagos() {
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null ||
                typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            Promise.all([
                PAGOS_REF.once('value'),
                USUARIOS_REF.once('value'),
                NOMBRES_MODULOS_REF ? NOMBRES_MODULOS_REF.once('value') : Promise.resolve({ val: () => ({ I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' }) })
            ]).then(([pSnap, uSnap, mSnap]) => {
                const pagos = pSnap.val() || {};
                const usuarios = uSnap.val() || [];
                const modulosData = mSnap.val() || { I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' };
                nombresModulosCache = modulosData;

                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="bi bi-credit-card"></i> Todos los Pagos</h2>
                        <button class="btn btn-secondary" onclick="cargarPagos()">
                            <i class="bi bi-arrow-left"></i> Volver a Pagos por Aula
                        </button>
                    </div>
                    <div class="pago-filtros">
                        <input type="text" class="form-control" id="filtroAlumno"
                               placeholder="🔍 Buscar por alumno..." oninput="filtrarPagosGlobal()">
                        <select class="form-select" id="filtroEstado" onchange="filtrarPagosGlobal()">
                            <option value="todos">Todos los estados</option>
                            <option value="pagado">✅ Pagado</option>
                            <option value="pendiente">⏳ Pendiente</option>
                            <option value="vencido">❌ Vencido</option>
                        </select>
                        <button class="btn btn-primary" onclick="mostrarPagosPorAula()">
                            <i class="bi bi-grid"></i> Vista por Aula
                        </button>
                    </div>
                    <div id="listaPagosGlobal">
                `;

                const keys = Object.keys(pagos);
                if (keys.length === 0) {
                    html += `<div class="alert alert-info">No hay pagos registrados.</div>`;
                } else {
                    keys.sort((a, b) => new Date(pagos[b].fecha) - new Date(pagos[a].fecha));

                    let totalPendiente = 0;
                    let totalPagado = 0;

                    keys.forEach(key => {
                        const p = pagos[key];
                        const alumno = usuarios.find(u => u.dni === p.alumno_dni);
                        const nombreAlumno = alumno?.nombre || p.alumno_nombre || 'Alumno no encontrado';
                        const monto = parseFloat(p.monto) || 0;
                        const nombreModulo = modulosData[p.modulo] || p.modulo || 'Módulo';

                        if (p.estado === 'pendiente') totalPendiente += monto;
                        else if (p.estado === 'pagado') totalPagado += monto;

                        const estadoClase = p.estado || 'pendiente';
                        const estadoTexto = {
                            'pagado': '✅ Pagado',
                            'pendiente': '⏳ Pendiente',
                            'vencido': '❌ Vencido'
                        } [estadoClase] || estadoClase;

                        html += `
                            <div class="pago-card" data-alumno="${nombreAlumno.toLowerCase()}" data-estado="${estadoClase}">
                                <div class="row align-items-center">
                                    <div class="col-md-3">
                                        <div class="pago-alumno">${nombreAlumno}</div>
                                        <div class="pago-concepto">${p.concepto || 'Sin concepto'}</div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="pago-monto">${formatearMoneda(monto)}</div>
                                        <div class="pago-fecha">📅 ${formatearFecha(p.fecha)}</div>
                                    </div>
                                    <div class="col-md-2">
                                        <span class="pago-modulo">📚 ${nombreModulo}</span>
                                    </div>
                                    <div class="col-md-2">
                                        <span class="pago-estado ${estadoClase}">${estadoTexto}</span>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="pago-acciones">
                                            ${estadoClase === 'pendiente' ? `
                                                <button class="btn btn-sm btn-success" onclick="marcarPagoPagadoGlobal('${key}')">
                                                    <i class="bi bi-check-circle"></i> Pagar
                                                </button>
                                            ` : ''}
                                            ${estadoClase === 'pagado' ? `
                                                <button class="btn btn-sm btn-warning" onclick="marcarPagoPendienteGlobal('${key}')">
                                                    <i class="bi bi-arrow-counterclockwise"></i> Revertir
                                                </button>
                                            ` : ''}
                                            <button class="btn btn-sm btn-danger" onclick="eliminarPagoGlobal('${key}')">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `
                        <div class="row g-3 mt-3">
                            <div class="col-md-4">
                                <div class="pago-resumen">
                                    <div class="icono"><i class="bi bi-clock"></i></div>
                                    <div class="numero">${formatearMoneda(totalPendiente)}</div>
                                    <div class="label">Total Pendiente</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="pago-resumen">
                                    <div class="icono"><i class="bi bi-check-circle"></i></div>
                                    <div class="numero">${formatearMoneda(totalPagado)}</div>
                                    <div class="label">Total Pagado</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="pago-resumen">
                                    <div class="icono"><i class="bi bi-wallet2"></i></div>
                                    <div class="numero">${formatearMoneda(totalPendiente + totalPagado)}</div>
                                    <div class="label">Total General</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
                document.getElementById('contentArea').innerHTML = html;
            }).catch(err => {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
        }

        function filtrarPagosGlobal() {
            const filtroAlumno = document.getElementById('filtroAlumno').value.toLowerCase().trim();
            const filtroEstado = document.getElementById('filtroEstado').value;

            document.querySelectorAll('.pago-card').forEach(card => {
                const alumno = card.dataset.alumno || '';
                const estado = card.dataset.estado || '';
                let mostrar = true;
                if (filtroAlumno && !alumno.includes(filtroAlumno)) mostrar = false;
                if (filtroEstado !== 'todos' && estado !== filtroEstado) mostrar = false;
                card.style.display = mostrar ? 'block' : 'none';
            });
        }

        function marcarPagoPagadoGlobal(key) {
            if (!confirm('¿Marcar este pago como PAGADO?')) return;
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(key).update({ estado: 'pagado' })
                .then(() => {
                    mostrarToast('✅ Pago marcado como pagado.');
                    cargarTodosLosPagos();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function marcarPagoPendienteGlobal(key) {
            if (!confirm('¿Revertir este pago a PENDIENTE?')) return;
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(key).update({ estado: 'pendiente' })
                .then(() => {
                    mostrarToast('🔄 Pago revertido a pendiente.');
                    cargarTodosLosPagos();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function eliminarPagoGlobal(key) {
            if (!confirm('¿Eliminar este pago definitivamente?')) return;
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(key).remove()
                .then(() => {
                    mostrarToast('🗑️ Pago eliminado.');
                    cargarTodosLosPagos();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        // ============================================
        // AUDITORÍA
        // ============================================

                document.getElementById('contentArea').innerHTML = `

                                <option value="baja">Baja</option>

                                <option value="horario_inusual">Horario Inusual</option>

                            <input type="date" id="filtroFechaDesde" onchange="filtrarAuditoria()">
                            <input type="date" id="filtroFechaHasta" onchange="filtrarAuditoria()">
                        </div>

                        <div id="resumenSeguridad" class="resumen-seguridad">
                            <div class="card-seguridad critica">
                                <div class="numero" id="totalCriticas">0</div>
                                <div class="label">🔴 Críticas</div>
                            </div>
                            <div class="card-seguridad alta">
                                <div class="numero" id="totalAltas">0</div>
                                <div class="label">🟠 Altas</div>
                            </div>
                            <div class="card-seguridad media">
                                <div class="numero" id="totalMedias">0</div>
                                <div class="label">🟡 Medias</div>

                                <div class="numero" id="totalBajas">0</div>

                        <div id="tablaAuditoria" class="tabla-auditoria">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Fecha/Hora</th>

                                        </td>

                `;

                await cargarDatosAuditoria();

                console.error('Error cargando auditoría:', error);

                    <div class="alert alert-danger">

        async function cargarDatosAuditoria() {
            try {
                if (typeof AUDITORIA === 'undefined' || !AUDITORIA.obtenerSospechosas) {
                    throw new Error('Sistema de auditoría no disponible');
                }

                const data = await AUDITORIA.obtenerSospechosas();

                document.getElementById('totalCriticas').textContent = data.resumen.criticas || 0;
                document.getElementById('totalAltas').textContent = data.resumen.altas || 0;
                document.getElementById('totalMedias').textContent = data.resumen.medias || 0;
                document.getElementById('totalBajas').textContent = data.resumen.bajas || 0;

                renderizarTablaAuditoria(data.todas || []);

                verificarAlertasNoLeidas();

            } catch (error) {
                console.error('Error cargando datos de auditoría:', error);
                document.getElementById('cuerpoAuditoria').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger py-4">
                            <i class="bi bi-exclamation-triangle"></i>
                            Error al cargar datos: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        function renderizarTablaAuditoria(actividades) {
            const tbody = document.getElementById('cuerpoAuditoria');

            if (!actividades || actividades.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-check-circle" style="font-size: 32px; color: #28a745;"></i>
                            <p class="mt-2">No se han registrado actividades sospechosas</p>
                            <small class="text-muted">El sistema está funcionando correctamente</small>
                        </td>
                    </tr>
                `;
                return;
            }

            const tiposLabels = {
                'login_fallido': '🚫 Login Fallido',
                'login_exitoso': '✅ Login Exitoso',
                'cambio_contraseña': '🔑 Cambio Contraseña',
                'edicion_usuario': '✏️ Edición Usuario',
                'eliminacion_usuario': '🗑️ Eliminación Usuario',
                'edicion_notas': '📝 Edición Notas',
                'eliminacion_notas': '🗑️ Eliminación Notas',
                'intento_fuerza_bruta': '💥 Fuerza Bruta',
                'horario_inusual': '🌙 Horario Inusual',
                'multiples_intentos': '🔁 Múltiples Intentos',
                'aprobacion_solicitud': '✅ Aprobación Solicitud',
                'rechazo_solicitud': '❌ Rechazo Solicitud',
                'cambio_permiso': '🔓 Cambio Permiso',
                'edicion_pagos': '💰 Edición Pagos',
                'eliminacion_pagos': '🗑️ Eliminación Pagos'
            };

            let html = '';
            actividades.forEach(a => {
                const fecha = new Date(a.fecha);
                const fechaStr = fecha.toLocaleDateString('es-ES');
                const horaStr = fecha.toLocaleTimeString('es-ES');

                const esReciente = (Date.now() - a.timestamp) < 86400000;

                html += `
                    <tr ${esReciente ? 'style="background: #fff8e1;"' : ''}>
                        <td>
                            <strong>${fechaStr}</strong>
                            <br><small class="text-muted">${horaStr}</small>
                            ${esReciente ? '<br><span class="badge bg-warning text-dark">Nuevo</span>' : ''}
                        </td>
                        <td>
                            <strong>${a.usuario || 'Desconocido'}</strong>
                            <br><small class="text-muted">${a.usuario_rol || 'desconocido'}</small>
                        </td>
                        <td>${tiposLabels[a.tipo] || a.tipo}</td>
                        <td>
                            <span class="severidad-badge ${a.severidad}">
                                ${(a.severidad || 'baja').toUpperCase()}
                            </span>
                        </td>
                        <td>
                            ${a.descripcion || 'Sin descripción'}
                            ${a.metadata?.intentos ? `<br><small class="text-muted">Intentos: ${a.metadata.intentos}</small>` : ''}
                            ${a.metadata?.hora ? `<br><small class="text-muted">Hora: ${a.metadata.hora}:00</small>` : ''}
                        </td>
                        <td>
                            <small>${a.ip || 'N/A'}</small>
                            <br><small class="text-muted">${a.navegador || ''}</small>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="verDetalleAuditoria('${a.id}')">
                                <i class="bi bi-eye"></i>
                            </button>
                            ${a.severidad === 'critica' ? `
                                <button class="btn btn-sm btn-outline-danger" onclick="marcarCriticaAuditoria('${a.id}')">
                                    <i class="bi bi-flag"></i>
                                </button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

            const alertas = actividades.filter(a => a.severidad === 'critica' || a.severidad === 'alta');
            const link = document.querySelector('[data-section="auditoria"]');
            if (link) {
                const badge = link.querySelector('.badge-alerta');
                if (alertas.length > 0) {
                    if (!badge) {
                        const newBadge = document.createElement('span');
                        newBadge.className = 'badge-alerta';
                        newBadge.textContent = alertas.length;
                        link.appendChild(newBadge);
                    } else {
                        badge.textContent = alertas.length;
                        badge.style.display = 'inline';
                    }
                } else {
                    if (badge) badge.style.display = 'none';
                }
            }
        }

        async function filtrarAuditoria() {
            const severidad = document.getElementById('filtroSeveridad').value;
            const tipo = document.getElementById('filtroTipo').value;
            const fechaDesde = document.getElementById('filtroFechaDesde').value;
            const fechaHasta = document.getElementById('filtroFechaHasta').value;

            const filtros = {};
            if (severidad !== 'todas') filtros.severidad = severidad;
            if (tipo !== 'todos') filtros.tipo = tipo;
            if (fechaDesde) filtros.fecha_desde = fechaDesde;
            if (fechaHasta) filtros.fecha_hasta = fechaHasta;

            try {
                if (typeof AUDITORIA === 'undefined' || !AUDITORIA.obtenerSospechosas) {
                    throw new Error('Sistema de auditoría no disponible');
                }
                const data = await AUDITORIA.obtenerSospechosas(filtros);
                renderizarTablaAuditoria(data.todas || []);
            } catch (error) {
                console.error('Error filtrando auditoría:', error);
            }
        }

        function verificarAlertasNoLeidas() {
            try {
                const alertas = JSON.parse(localStorage.getItem('alertas_seguridad') || '[]');
                const noLeidas = alertas.filter(a => !a.leida);
                if (noLeidas.length > 0) {
                    const link = document.querySelector('[data-section="auditoria"]');
                    if (link) {
                        const badge = link.querySelector('.badge-alerta');
                        if (!badge) {
                            const newBadge = document.createElement('span');
                            newBadge.className = 'badge-alerta';
                            newBadge.textContent = noLeidas.length;
                            link.appendChild(newBadge);
                        } else {
                            badge.textContent = noLeidas.length;
                            badge.style.display = 'inline';
                        }
                    }
                }
            } catch (e) {
                console.warn('Error verificando alertas:', e);
            }
        }

        function verDetalleAuditoria(id) {
            alert(`🔍 Detalle de actividad\n\nID: ${id}\n\nFunción en desarrollo.`);
        }

        function marcarCriticaAuditoria(id) {
            if (confirm('¿Marcar esta actividad como crítica?')) {
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'cambio_severidad',
                        'media',
                        session.dni,
                        `Actividad ${id} marcada como crítica`,
                        { actividad_id: id }
                    );
                }
                mostrarToast('✅ Actividad marcada como crítica', 'warning');
                cargarAuditoria();
            }
        }

        function limpiarAlertasAuditoria() {
            if (confirm('¿Limpiar todas las alertas de seguridad?')) {
                localStorage.removeItem('alertas_seguridad');
                const link = document.querySelector('[data-section="auditoria"]');
                if (link) {
                    const badge = link.querySelector('.badge-alerta');
                    if (badge) badge.style.display = 'none';
                }
                mostrarToast('🗑️ Alertas limpiadas');
                cargarAuditoria();
            }

        // ============================================
        // ACCESO - GESTIÓN DE BLOQUEO DE ROLES
        // ============================================
        function cargarAcceso() {
            if (typeof CONFIG_REF === 'undefined' || CONFIG_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            const container = document.getElementById('contentArea');
            container.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-door-open"></i> Gestión de Acceso</h2>
                    <span class="text-muted">Controla quién puede iniciar sesión en el sistema</span>
                </div>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i>
                    <strong>Nota:</strong> Al bloquear un rol, los usuarios de ese rol no podrán iniciar sesión hasta que los desbloquees.
                    <br>Esta función es útil para realizar mantenimiento o restringir el acceso temporalmente.
                </div>
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-shield-lock"></i> Estados de Acceso por Rol
                    </div>
                    <div class="card-body" id="accesoRolesContainer">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary"></div>
                            <p class="mt-2">Cargando configuración de acceso...</p>
                        </div>
                    </div>
                </div>
            `;

            CONFIG_REF.child('accesos').once('value').then(snapshot => {
                const accesos = snapshot.val() || {};
                const estados = {
                    admin_secundario: accesos.admin_secundario !== undefined ? accesos.admin_secundario : true,
                    docente: accesos.docente !== undefined ? accesos.docente : true,
                    padre: accesos.padre !== undefined ? accesos.padre : true,
                    alumno: accesos.alumno !== undefined ? accesos.alumno : true
                };

                const rolesInfo = {
                    admin_secundario: { label: 'Admins Secundarios', icon: 'bi-person-gear', color: '#6c757d' },
                    docente: { label: 'Docentes', icon: 'bi-person-badge', color: '#0d6efd' },
                    padre: { label: 'Padres de Familia', icon: 'bi-people', color: '#198754' },
                    alumno: { label: 'Alumnos', icon: 'bi-person', color: '#fd7e14' }
                };

                let html = '';
                Object.keys(rolesInfo).forEach(rol => {
                    const info = rolesInfo[rol];
                    const activo = estados[rol];
                    const color = info.color;
                    const icono = info.icon;

                    html += `
                        <div class="row align-items-center py-3 border-bottom acceso-rol-item">
                            <div class="col-md-4">
                                <i class="bi ${icono}" style="font-size: 24px; color: ${color};"></i>
                                <span class="ms-2 fw-bold" style="font-size: 16px;">${info.label}</span>
                            </div>
                            <div class="col-md-4">
                                <span class="badge ${activo ? 'bg-success' : 'bg-danger'} px-3 py-2" id="estado_${rol}" style="font-size: 14px;">
                                    ${activo ? '✅ ACTIVO' : '❌ BLOQUEADO'}
                                </span>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="form-check form-switch d-inline-block">
                                    <input class="form-check-input toggle-acceso" type="checkbox" id="toggle_${rol}" 
                                           data-rol="${rol}" ${activo ? 'checked' : ''} 
                                           style="width: 60px; height: 30px; cursor: pointer;">
                                    <label class="form-check-label ms-2 fw-bold" for="toggle_${rol}" style="font-size: 14px;">
                                        ${activo ? '🟢 Desbloqueado' : '🔴 Bloqueado'}
                                    </label>
                                </div>
                            </div>
                        </div>
                    `;
                });

                const totalRoles = Object.keys(rolesInfo).length;
                const activos = Object.values(estados).filter(v => v === true).length;
                const bloqueados = totalRoles - activos;

                html += `
                    <div class="row mt-4">
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h3 class="text-success">${activos}</h3>
                                    <p class="text-muted">Roles Activos</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h3 class="text-danger">${bloqueados}</h3>
                                    <p class="text-muted">Roles Bloqueados</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h3>${totalRoles}</h3>
                                    <p class="text-muted">Total Roles</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 text-muted">
                        <small><i class="bi bi-clock-history"></i> Los cambios se aplican en tiempo real.</small>
                    </div>
                `;

                container.querySelector('#accesoRolesContainer').innerHTML = html;

                document.querySelectorAll('.toggle-acceso').forEach(toggle => {
                    toggle.addEventListener('change', function() {
                        const rol = this.dataset.rol;
                        const activo = this.checked;
                        actualizarAccesoRol(rol, activo);
                    });
                });

            }).catch(err => {
                container.querySelector('#accesoRolesContainer').innerHTML = `
                    <div class="alert alert-danger">Error al cargar configuración: ${err.message}</div>
                `;
            });
        }

        // ============================================
        // ACTUALIZAR ACCESO DE UN ROL EN FIREBASE
        // ============================================
        function actualizarAccesoRol(rol, activo) {
            if (typeof CONFIG_REF === 'undefined' || CONFIG_REF === null) {
                mostrarToast('❌ Error de conexión', 'error');
                return;
            }

            const estadoEl = document.getElementById(`estado_${rol}`);
            const label = document.querySelector(`label[for="toggle_${rol}"]`);

            if (estadoEl) {
                estadoEl.className = `badge ${activo ? 'bg-success' : 'bg-danger'} px-3 py-2`;
                estadoEl.textContent = activo ? '✅ ACTIVO' : '❌ BLOQUEADO';
            }
            if (label) {
                label.textContent = activo ? '🟢 Desbloqueado' : '🔴 Bloqueado';
            }

            CONFIG_REF.child('accesos').child(rol).set(activo).then(() => {
                mostrarToast(`✅ Acceso de ${rol} ${activo ? 'desbloqueado' : 'bloqueado'} correctamente`, 'success');
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'cambio_acceso',
                        'media',
                        session.dni,
                        `${rol} ${activo ? 'desbloqueado' : 'bloqueado'} por Admin Principal`,
                        { rol: rol, estado: activo }
                    );
                }
                cargarAcceso();
            }).catch(err => {
                mostrarToast(`❌ Error al guardar: ${err.message}`, 'error');
                console.error('Error al guardar acceso:', err);
                if (estadoEl) {
                    estadoEl.className = `badge ${!activo ? 'bg-success' : 'bg-danger'} px-3 py-2`;
                    estadoEl.textContent = !activo ? '✅ ACTIVO' : '❌ BLOQUEADO';
                }
                if (label) {
                    label.textContent = !activo ? '🟢 Desbloqueado' : '🔴 Bloqueado';
                }
                const toggle = document.getElementById(`toggle_${rol}`);
                if (toggle) toggle.checked = !activo;
            });
        }

        function eliminarPregunta(btn) {
            const item = btn.closest('.pregunta-item');
            if (document.querySelectorAll('.pregunta-item').length <= 1) {
                alert('Debe haber al menos una pregunta.');
                return;
            }
            if (confirm('¿Eliminar esta pregunta?')) {
                item.remove();
                document.querySelectorAll('.pregunta-item').forEach((el, i) => {
                    el.dataset.index = i;
                    const label = el.querySelector('.mb-2 label');
                    if (label) label.textContent = `Pregunta ${i + 1}`;
                });
            }
        }

        function guardarExamen(e) {
            e.preventDefault();

            const preguntas = [];
            const items = document.querySelectorAll('.pregunta-item');
            
            items.forEach(item => {
                const texto = item.querySelector('.pregunta-texto').value.trim();
                const opciones = [];
                item.querySelectorAll('.opcion-input').forEach(inp => {
                    opciones.push(inp.value.trim());
                });
                const respuestaCorrecta = parseInt(item.querySelector('.respuesta-correcta').value);
                
                if (texto && opciones.every(o => o)) {
                    preguntas.push({
                        texto: texto,
                        opciones: opciones,
                        respuesta: respuestaCorrecta
                    });
                }
            });

            if (preguntas.length === 0) {
                alert('❌ Debes agregar al menos una pregunta con todas las opciones completas.');
                return;
            }

            const data = {
                id: generarId(),
                titulo: document.getElementById('exTitulo').value.trim(),
                materia: document.getElementById('exMateria').value.trim(),
                grado: document.getElementById('exGrado').value.trim(),
                modulo: document.getElementById('exModulo').value,
                docente_dni: document.getElementById('exDocente').value || null,
                fecha_examen: document.getElementById('exFecha').value,
                hora_inicio: document.getElementById('exHoraInicio').value,
                duracion: parseInt(document.getElementById('exDuracion').value) || 30,
                preguntas: preguntas,
                activo: true,
                fecha_creacion: new Date().toISOString(),
                creado_por: session.dni
            };

            if (!data.titulo || !data.materia || !data.grado || !data.fecha_examen || !data.hora_inicio) {
                alert('❌ Completa todos los campos obligatorios.');
                return;
            }

            if (typeof EXAMENES_REF === 'undefined' || EXAMENES_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            EXAMENES_REF.push(data).then(() => {
                mostrarToast('✅ Examen creado correctamente.');
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'creacion_examen',
                        'media',
                        session.dni,
                        `Examen "${data.titulo}" creado para ${data.grado}`,
                        { materia: data.materia, modulo: data.modulo }
                    );
                }
                cargarExamenesAdmin();
            }).catch(err => {
                alert('❌ Error: ' + err.message);
            });
        }

        function eliminarExamen(id) {
            if (!confirm('¿Eliminar este examen definitivamente?')) return;
            if (typeof EXAMENES_REF === 'undefined' || EXAMENES_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            EXAMENES_REF.once('value').then(snap => {
                let examenes = snap.val() || {};
                if (!Array.isArray(examenes)) {
                    examenes = Object.values(examenes);
                }
                const filtered = examenes.filter(e => e.id !== id);
                EXAMENES_REF.set(filtered).then(() => {
                    mostrarToast('🗑️ Examen eliminado.');
                    cargarExamenesAdmin();
                });
            }).catch(err => alert('Error: ' + err.message));
        }

            if (typeof RESPUESTAS_EXAMEN_REF === 'undefined' || RESPUESTAS_EXAMEN_REF === null) {

                return;
            }

            RESPUESTAS_EXAMEN_REF.orderByChild('examen_id').equalTo(id).once('value').then(snap => {
                const respuestas = snap.val() || {};
                const keys = Object.keys(respuestas);

                if (keys.length === 0) {
                    alert('📊 No hay respuestas para este examen aún.');
                    return;
                }

                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="bi bi-bar-chart"></i> Resultados del Examen</h2>
                        <button class="btn btn-secondary" onclick="cargarExamenesAdmin()">
                            <i class="bi bi-arrow-left"></i> Volver
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Alumno</th>
                                    <th>DNI</th>
                                    <th>Nota</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                keys.forEach(key => {
                    const r = respuestas[key];
                    html += `
                        <tr>
                            <td>${r.alumno_nombre || 'N/A'}</td>
                            <td>${r.alumno_dni || 'N/A'}</td>
                            <td><strong>${r.nota || 0}</strong></td>
                            <td>${new Date(r.fecha).toLocaleDateString('es-ES')}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                document.getElementById('contentArea').innerHTML = html;
            }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ============================================
        // FUNCIONES PARA SEGURIDAD 2FA (ADMIN PRINCIPAL)
        // ============================================
        function cargarSeguridad2FA() {
            if (typeof SEGURIDAD_REF === 'undefined' || SEGURIDAD_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            SEGURIDAD_REF.child('2fa').once('value').then(snap => {
                const config = snap.val() || { activo: false, codigo: '', expiracion: '' };
                const activo = config.activo === true;
                const codigo = config.codigo || '------';
                const expiracion = config.expiracion ? new Date(config.expiracion).toLocaleString('es-ES') : 'No activado';

                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="bi bi-shield-lock-fill"></i> Autenticación de Dos Factores (2FA)</h2>
                        <span class="badge ${activo ? 'bg-success' : 'bg-danger'}">${activo ? '✅ ACTIVO' : '❌ INACTIVO'}</span>
                    </div>
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        <strong>Autenticación de Dos Factores (2FA):</strong>
                        <br>Al activar esta opción, se requerirá un código de verificación adicional al iniciar sesión.
                        <br>Esto añade una capa extra de seguridad a tu cuenta.
                    </div>
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <h5>Estado Actual</h5>
                                    <p><strong>Código 2FA:</strong> <span class="codigo-2fa ${activo ? 'activo' : 'inactivo'}">${codigo}</span></p>
                                    <p><strong>Expiración:</strong> ${expiracion}</p>
                                </div>
                                <div class="col-md-4 text-center">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input toggle-acceso" type="checkbox" id="toggle2FA" 
                                               ${activo ? 'checked' : ''} style="width: 80px; height: 35px;">
                                        <label class="form-check-label fw-bold" for="toggle2FA" style="font-size: 16px;">
                                            ${activo ? '🔐 Activo' : '🔓 Inactivo'}
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div id="codigoContainer" style="${activo ? 'display:block;' : 'display:none;'}">
                                <hr>
                                <h5>Generar Nuevo Código 2FA</h5>
                                <button class="btn btn-primary" onclick="generarCodigo2FA()">
                                    <i class="bi bi-arrow-repeat"></i> Generar Nuevo Código
                                </button>
                                <button class="btn btn-danger" onclick="desactivar2FA()">
                                    <i class="bi bi-lock"></i> Desactivar 2FA
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-clock-history"></i> Historial de Inicios de Sesión
                        </div>
                        <div class="card-body" id="historialLoginContainer">
                            <div class="text-center text-muted py-3">Cargando historial...</div>
                        </div>
                    </div>
                `;

                document.getElementById('contentArea').innerHTML = html;

                document.getElementById('toggle2FA').addEventListener('change', function() {
                    if (this.checked) {
                        generarCodigo2FA();
                    } else {
                        desactivar2FA();
                    }
                });

                cargarHistorialLogin();
            }).catch(err => {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
        }

        function generarCodigo2FA() {
            if (typeof SEGURIDAD_REF === 'undefined' || SEGURIDAD_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            const codigo = String(Math.floor(100000 + Math.random() * 900000));
            const expiracion = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();

            SEGURIDAD_REF.child('2fa').set({
                activo: true,
                codigo: codigo,
                expiracion: expiracion
            }).then(() => {
                mostrarToast('✅ Código 2FA generado: ' + codigo, 'warning');
                mostrarToast('⚠️ Guarda este código en un lugar seguro.', 'warning');
                cargarSeguridad2FA();
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'generacion_2fa',
                        'alta',
                        session.dni,
                        'Nuevo código 2FA generado',
                        {}
                    );
                }
            }).catch(err => alert('Error: ' + err.message));
        }

        function desactivar2FA() {
            if (!confirm('¿Estás seguro de desactivar la autenticación de dos factores?')) return;

            if (typeof SEGURIDAD_REF === 'undefined' || SEGURIDAD_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            SEGURIDAD_REF.child('2fa').set({
                activo: false,
                codigo: '',
                expiracion: ''
            }).then(() => {
                mostrarToast('🔓 2FA desactivado');
                cargarSeguridad2FA();
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'desactivacion_2fa',
                        'alta',
                        session.dni,
                        '2FA desactivado',
                        {}
                    );
                }
            }).catch(err => alert('Error: ' + err.message));
        }

        function cargarHistorialLogin() {
            if (typeof AUDITORIA_REF === 'undefined' || AUDITORIA_REF === null) {
                document.getElementById('historialLoginContainer').innerHTML =
                    '<div class="text-muted">No hay historial disponible.</div>';
                return;
            }

            AUDITORIA_REF.orderByChild('usuario').equalTo(session.dni).limitToLast(20).once('value').then(snap => {
                const data = snap.val() || {};
                const keys = Object.keys(data);
                
                if (keys.length === 0) {
                    document.getElementById('historialLoginContainer').innerHTML = 
                        '<div class="text-muted">No hay inicios de sesión registrados.</div>';
                    return;
                }

                let html = `
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>IP</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                keys.sort((a, b) => (data[b].timestamp || 0) - (data[a].timestamp || 0));
                keys.forEach(key => {
                    const item = data[key];
                    if (item.tipo === 'login_exitoso' || item.tipo === 'login_fallido') {
                        html += `
                            <tr>
                                <td>${new Date(item.fecha).toLocaleString('es-ES')}</td>
                                <td><span class="badge ${item.tipo === 'login_exitoso' ? 'bg-success' : 'bg-danger'}">${item.tipo === 'login_exitoso' ? '✅ Exitoso' : '❌ Fallido'}</span></td>
                                <td>${item.ip || 'N/A'}</td>
                            </tr>
                        `;
                    }
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                document.getElementById('historialLoginContainer').innerHTML = html;
            }).catch(err => {
                document.getElementById('historialLoginContainer').innerHTML = 
                    '<div class="text-muted">Error al cargar historial.</div>';
            });
        }

        // ============================================
        // FUNCIONES PARA TUTORÍAS (ADMIN PRINCIPAL)
        // ============================================
        function cargarTutoriasAdmin() {
            if (typeof TUTORIAS_REF === 'undefined' || TUTORIAS_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            Promise.all([
                TUTORIAS_REF.once('value'),
                USUARIOS_REF ? USUARIOS_REF.once('value') : Promise.resolve({ val: () => [] })
            ]).then(([tSnap, uSnap]) => {
                let tutorias = tSnap.val() || {};
                if (!Array.isArray(tutorias)) {
                    tutorias = Object.values(tutorias);
                }
                const usuarios = uSnap.val() || [];

                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="bi bi-chat-dots"></i> Gestión de Tutorías</h2>
                        <button class="btn btn-primary" onclick="mostrarFormularioTutoria()">
                            <i class="bi bi-plus-circle"></i> Nueva Tutoría
                        </button>
                    </div>
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        <strong>Tutorías:</strong> Registra las tutorías realizadas con los alumnos.
                        Solo los tutores pueden ver esta información.
                    </div>
                    <div id="listaTutorias">
                `;

                if (tutorias.length === 0) {
                    html += `<div class="alert alert-info">No hay tutorías registradas.</div>`;
                } else {
                    tutorias.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                    tutorias.forEach(t => {
                        const alumno = usuarios.find(u => u.dni === t.alumno_dni);
                        const estadoClase = t.estado === 'atendido' ? 'atendido' : 'pendiente';
                        const estadoTexto = t.estado === 'atendido' ? '✅ Atendido' : '⏳ Pendiente';

                        html += `
                            <div class="tutoria-card">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="tutoria-alumno">👤 ${alumno?.nombre || t.alumno_nombre || 'Alumno'}</div>
                                        <div class="tutoria-fecha">📅 ${new Date(t.fecha).toLocaleDateString('es-ES')} - ${t.hora || ''}</div>
                                        <div class="mt-1"><strong>Tema:</strong> ${t.tema || 'Sin tema'}</div>
                                        <div><small>${t.descripcion || ''}</small></div>
                                    </div>
                                    <div class="text-end">
                                        <span class="tutoria-estado ${estadoClase}">${estadoTexto}</span>
                                        <br>
                                        <button class="btn btn-sm btn-success mt-1" onclick="atenderTutoria('${t.id}')">
                                            <i class="bi bi-check"></i> Atender
                                        </button>
                                        <button class="btn btn-sm btn-danger mt-1" onclick="eliminarTutoria('${t.id}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div>`;
                document.getElementById('contentArea').innerHTML = html;
            }).catch(err => {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
        }

        function mostrarFormularioTutoria() {
            USUARIOS_REF.once('value').then(snap => {
                const usuarios = snap.val() || [];
                const alumnos = usuarios.filter(u => u.rol === 'alumno');

                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="bi bi-plus-circle"></i> Nueva Tutoría</h2>
                        <button class="btn btn-secondary" onclick="cargarTutoriasAdmin()">
                            <i class="bi bi-arrow-left"></i> Volver
                        </button>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <form id="tutoriaForm" onsubmit="guardarTutoria(event)">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">Alumno</label>
                                            <select class="form-control" id="tutAlumno" required>
                                                <option value="">Seleccione un alumno</option>
                                                ${alumnos.map(a => `<option value="${a.dni}">${a.nombre || a.nombres}</option>`).join('')}
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">Fecha</label>
                                            <input type="date" class="form-control" id="tutFecha" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">Hora</label>
                                            <input type="time" class="form-control" id="tutHora" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">Estado</label>
                                            <select class="form-control" id="tutEstado">
                                                <option value="pendiente">Pendiente</option>
                                                <option value="atendido">Atendido</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tema</label>
                                    <input type="text" class="form-control" id="tutTema" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Descripción</label>
                                    <textarea class="form-control" id="tutDescripcion" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-save"></i> Guardar Tutoría
                                </button>
                            </form>
                        </div>
                    </div>
                `;

                document.getElementById('contentArea').innerHTML = html;
            });
        }

        function guardarTutoria(e) {
            e.preventDefault();

            const data = {
                id: generarId(),
                alumno_dni: document.getElementById('tutAlumno').value,
                alumno_nombre: '',
                fecha: document.getElementById('tutFecha').value,
                hora: document.getElementById('tutHora').value,
                tema: document.getElementById('tutTema').value.trim(),
                descripcion: document.getElementById('tutDescripcion').value.trim(),
                estado: document.getElementById('tutEstado').value,
                creado_por: session.dni,
                fecha_creacion: new Date().toISOString()
            };

            if (!data.alumno_dni || !data.fecha || !data.hora || !data.tema) {
                alert('❌ Completa todos los campos obligatorios.');
                return;
            }

            USUARIOS_REF.once('value').then(snap => {
                const usuarios = snap.val() || [];
                const alumno = usuarios.find(u => u.dni === data.alumno_dni);
                data.alumno_nombre = alumno?.nombre || alumno?.nombres || 'Alumno';

                if (typeof TUTORIAS_REF === 'undefined' || TUTORIAS_REF === null) {
                    alert('❌ Error de conexión');
                    return;
                }

                TUTORIAS_REF.push(data).then(() => {
                    mostrarToast('✅ Tutoría registrada correctamente.');
                    if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                        AUDITORIA.registrar(
                            'creacion_tutoria',
                            'baja',
                            session.dni,
                            `Tutoría registrada para ${data.alumno_nombre}`,
                            { tema: data.tema }
                        );
                    }
                    cargarTutoriasAdmin();
                }).catch(err => alert('Error: ' + err.message));
            });
        }

        function atenderTutoria(id) {
            if (!confirm('¿Marcar esta tutoría como atendida?')) return;
            if (typeof TUTORIAS_REF === 'undefined' || TUTORIAS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            TUTORIAS_REF.once('value').then(snap => {
                let tutorias = snap.val() || {};
                if (!Array.isArray(tutorias)) {
                    tutorias = Object.values(tutorias);
                }
                const index = tutorias.findIndex(t => t.id === id);
                if (index !== -1) {
                    tutorias[index].estado = 'atendido';
                    TUTORIAS_REF.set(tutorias).then(() => {
                        mostrarToast('✅ Tutoría marcada como atendida.');
                        cargarTutoriasAdmin();
                    });
                }
            }).catch(err => alert('Error: ' + err.message));
        }

        function eliminarTutoria(id) {
            if (!confirm('¿Eliminar esta tutoría?')) return;
            if (typeof TUTORIAS_REF === 'undefined' || TUTORIAS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            TUTORIAS_REF.once('value').then(snap => {
                let tutorias = snap.val() || {};
                if (!Array.isArray(tutorias)) {
                    tutorias = Object.values(tutorias);
                }
                const filtered = tutorias.filter(t => t.id !== id);
                TUTORIAS_REF.set(filtered).then(() => {
                    mostrarToast('🗑️ Tutoría eliminada.');
                    cargarTutoriasAdmin();
                });
            }).catch(err => alert('Error: ' + err.message));
        }

        // ============================================
        // NAVEGACIÓN
        // ============================================
        function cargarSeccion(section) {
            switch (section) {
                case 'dashboard':
                    cargarDashboard();
                    break;
                case 'users':
                    cargarUsuarios();
                    break;
                case 'grades':
                    cargarNotas();
                    break;
                case 'attendance':
                    cargarAsistencias();
                    break;
                case 'announcements':
                    cargarAnuncios();
                    break;
                case 'fechas':
                    cargarFechasModulos();
                    break;
                case 'horarios':
                    cargarHorariosAdmin();
                    break;
                case 'pagos':
                    cargarPagos();
                    break;
                case 'settings':
                    cargarConfiguracion();
                    break;
                case 'materias':
                    cargarMaterias();
                    break;
                case 'permisos':
                    cargarPermisos();
                    break;
                case 'solicitudes':
                    cargarSolicitudes();
                    break;
                case 'auditoria':
                    cargarAuditoria();
                    break;
                case 'acceso':
                    cargarAcceso();
                    break;
                case 'examenes':
                    cargarExamenesAdmin();
                    break;
                case 'seguridad2fa':
                    cargarSeguridad2FA();
                    break;
                case 'tutorias':
                    cargarTutoriasAdmin();
                    break;
                default:
                    cargarDashboard();
            }
        }

        document.querySelectorAll('[data-section]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('[data-section]').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                const section = this.dataset.section;
                cargarSeccion(section);
            });
        });

        // ============================================
        // CERRAR SESIÓN
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('session');
            window.location.href = 'index.html';
        });

        // ============================================
        // REGISTRAR LOGIN EXITOSO
        // ============================================
        function registrarLoginExitoso() {
            if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                AUDITORIA.registrar(
                    'login_exitoso',
                    'baja',
                    session.dni,
                    `Inicio de sesión exitoso como ${session.rol}`,
                    { rol: session.rol }
                );
            }
        }
        registrarLoginExitoso();

        // ============================================
        // ESCUCHAR ELIMINACIONES Y CAMBIOS
        // ============================================
        if (typeof USUARIOS_REF !== 'undefined' && USUARIOS_REF !== null) {
            USUARIOS_REF.on('child_removed', (snapshot) => {
                const data = snapshot.val();
                if (data && typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'eliminacion_usuario',
                        'alta',
                        session?.dni || 'desconocido',
                        `Usuario eliminado: ${data.nombre || data.nombres || data.dni}`,
                        { dni: data.dni, rol: data.rol }
                    );
                }
            });
        }

        if (typeof NOTAS_REF !== 'undefined' && NOTAS_REF !== null) {
            NOTAS_REF.on('child_changed', (snapshot) => {
                const data = snapshot.val();
                if (data && typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'edicion_notas',
                        'media',
                        session?.dni || 'desconocido',
                        `Notas editadas para ${data.alumno_nombre || 'alumno'}`,
                        { materia: data.materia, modulo: data.modulo }
                    );
                }
            });
        }

        // ============================================
        // INICIALIZAR
        // ============================================
        window.onload = function() {
            console.log('🔄 Cargando Admin Principal...');

            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                console.error('❌ Firebase no está disponible');
                document.getElementById('contentArea').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        <strong>Error de conexión:</strong> Firebase no está disponible.
                        <br><button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">Recargar</button>
                    </div>
                `;
                return;
            }

            try {
                cargarConfiguracionFirebase();
                escucharConfiguracion();
                cargarNombresModulos();
                cargarNombreColumnas();
                cargarMateriasSistema();
                cargarDashboard();

                setTimeout(function() {
                    if (typeof inicializarAuditoriaRef === 'function' && window._databaseRef) {
                        try {
                            inicializarAuditoriaRef(window._databaseRef);
                            console.log('✅ Auditoría inicializada automáticamente');
                        } catch (e) {
                            console.warn('⚠️ Error al inicializar auditoría:', e);
                        }
                    }
                }, 1000);

                console.log('✅ Admin Principal iniciado correctamente');
            } catch (error) {
                console.error('❌ Error al iniciar:', error);
                document.getElementById('contentArea').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        <strong>Error:</strong> ${error.message}
                        <br><button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">Recargar</button>
                    </div>
                `;
            }
        };

        console.log('✅ Admin Principal - Código completo cargado exitosamente');
    </script>

    <!-- ============================================ -->
    <!-- CARGAR SISTEMA DE AUDITORÍA                  -->
    <!-- ============================================ -->
    <script src="auditoria.js"></script>
</body>
</html>
