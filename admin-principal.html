    <script>
        // ============================================
        // TOGGLE SIDEBAR - COLLAPSIBLE CON HOVER
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebarPrincipal');
            sidebar.classList.add('collapsed');
            const sidebarState = localStorage.getItem('sidebarPrincipalCollapsed');
            if (sidebarState === 'false') {
                sidebar.classList.remove('collapsed');
            } else if (sidebarState === 'true') {
                sidebar.classList.add('collapsed');
            }
        });

        // ============================================
        // SESIÓN
        // ============================================
        const session = JSON.parse(sessionStorage.getItem('session') || 'null');
        if (!session || session.rol !== 'admin_principal') {
            window.location.href = 'index.html';
        }
        document.getElementById('adminNombre').textContent = session.nombre || 'Admin Principal';

        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let configuracionGlobal = {};
        let todosLosUsuarios = [];
        let usuariosFiltrados = [];
        let busquedaActualUsuarios = '';
        let todosLosAlumnosPagos = [];
        let busquedaPagosTimeout = null;
        let alumnoSeleccionadoPago = null;
        let alumnosPorAulaCache = [];
        let pagosCache = {};
        let horariosCache = {};
        let permisosCache = {};
        let todosLosAlumnosPermisos = [];
        let alumnosFiltradosPermisos = [];
        let busquedaActualPermisos = '';

        const HORAS_PREDEFINIDAS = [
            '8:00 - 9:00', '9:00 - 10:00', '10:00 - 11:00', '11:00 - 12:00',
            '12:00 - 1:00', '1:00 - 2:00', '2:00 - 3:00', '3:00 - 4:00', '4:00 - 5:00'
        ];

        let MATERIAS_DISPONIBLES = [
            'Matemáticas', 'Comunicación', 'Ciencias Sociales', 'Ciencias Naturales',
            'Educación Física', 'Inglés', 'Arte', 'Música', 'Religión', 'Tecnología',
            'Historia', 'Geografía', 'Biología', 'Química', 'Física',
            'Lengua y Literatura', 'Filosofía', 'Psicología', 'Aritmética',
            'Álgebra', 'Geometría', 'Trigonometría', 'Cálculo', 'Estadística'
        ];

        const conceptosPagos = [
            'Pensión Mensual', 'Matrícula', 'Materiales', 'Uniforme',
            'Actividad Extraescolar', 'Refrigerio', 'Campaña Solidaria', 'Otro'
        ];

        let nombreColumnasCache = { EC: 'EC', EP: 'EP', ED: 'ED' };
        let nombresModulosCache = { I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' };

        // ============================================
        // FUNCIONES DE UTILIDAD
        // ============================================
        function generarId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function mostrarToast(mensaje, tipo = 'success') {
            const t = document.getElementById('toastSave');
            const iconos = {
                success: 'bi-check-circle-fill',
                error: 'bi-exclamation-triangle-fill',
                warning: 'bi-exclamation-triangle-fill'
            };
            const colores = {
                success: '#28a745',
                error: '#dc3545',
                warning: '#ffc107'
            };
            t.innerHTML = `<i class="bi ${iconos[tipo] || iconos.success}"></i> ${mensaje}`;
            t.style.background = colores[tipo] || colores.success;
            t.style.color = tipo === 'warning' ? '#212529' : 'white';
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function redondearValor(valor) {
            if (valor === '-' || valor === undefined || valor === null || isNaN(valor)) return '-';
            const num = parseFloat(valor);
            if (isNaN(num)) return '-';
            return (Math.round(num * 10) / 10).toFixed(1);
        }

        function formatearFecha(fecha) {
            if (!fecha) return '-';
            const d = new Date(fecha);
            return d.toLocaleDateString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function formatearMoneda(monto) {
            if (monto === undefined || monto === null || isNaN(monto)) return 'S/ 0.00';
            return 'S/ ' + parseFloat(monto).toFixed(2);
        }

        function quitarAcentos(texto) {
            if (!texto) return '';
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function normalizarTexto(texto) {
            if (!texto) return '';
            return quitarAcentos(texto.toLowerCase().trim());
        }

        function getFechaHoy() {
            const hoy = new Date();
            return hoy.getFullYear() + '-' +
                String(hoy.getMonth() + 1).padStart(2, '0') + '-' +
                String(hoy.getDate()).padStart(2, '0');
        }

        function getNombresModulos() {
            return nombresModulosCache;
        }

        function cargarNombresModulos() {
            if (typeof NOMBRES_MODULOS_REF === 'undefined' || NOMBRES_MODULOS_REF === null) return;
            return NOMBRES_MODULOS_REF.once('value')
                .then(s => {
                    const d = s.val();
                    if (d) nombresModulosCache = d;
                })
                .catch(e => console.error(e));
        }

        // ============================================
        // MATERIAS DEL SISTEMA (catálogo global)
        // ============================================
        function cargarMateriasSistema() {
            if (typeof MATERIAS_REF === 'undefined' || MATERIAS_REF === null) return Promise.resolve();
            return MATERIAS_REF.once('value').then(snap => {
                const data = snap.val();
                if (data && Array.isArray(data) && data.length > 0) {
                    MATERIAS_DISPONIBLES = data;
                } else if (data && typeof data === 'object') {
                    MATERIAS_DISPONIBLES = Object.values(data);
                } else {
                    // Primera vez: sembrar Firebase con la lista por defecto
                    MATERIAS_REF.set(MATERIAS_DISPONIBLES).catch(e => console.error('Error al sembrar materias:', e));
                }
                // Escuchar cambios en tiempo real para mantener la caché sincronizada
                MATERIAS_REF.on('value', s => {
                    const v = s.val();
                    if (Array.isArray(v)) MATERIAS_DISPONIBLES = v.filter(m => m !== null && m !== undefined);
                    else if (v && typeof v === 'object') MATERIAS_DISPONIBLES = Object.values(v);
                });
            }).catch(e => console.error('Error al cargar materias:', e));
        }

        function cargarMaterias() {
            if (typeof MATERIAS_REF === 'undefined' || MATERIAS_REF === null) {
                document.getElementById('contentArea').innerHTML = '<div class="alert alert-danger">Error: Firebase no está disponible</div>';

                        </button>
                    </div>
                `).join('')
                : '<div class="alert alert-info m-3">No hay materias registradas todavía.</div>';

            const html = `

                    <h2><i class="bi bi-journal-bookmark"></i> Gestión de Materias</h2>

                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-plus-circle"></i> Agregar Materia
                                    </button>
                                </form>
                                <div class="alert alert-info mt-3 mb-0">
                                    <i class="bi bi-info-circle"></i> Solo el administrador principal puede agregar o eliminar materias. Los cambios se reflejan automáticamente para todos los roles.

                    <div class="col-md-7 mb-3">

        function agregarMateriaSistema(e) {
            e.preventDefault();
            const input = document.getElementById('nombreNuevaMateria');
            const nombre = input.value.trim();
            if (!nombre) return;

            if (MATERIAS_DISPONIBLES.some(m => m.toLowerCase() === nombre.toLowerCase())) {
                mostrarToast('⚠️ Esa materia ya existe.', 'error');
                return;
            }

            const nuevaLista = [...MATERIAS_DISPONIBLES, nombre];
            MATERIAS_REF.set(nuevaLista).then(() => {
                MATERIAS_DISPONIBLES = nuevaLista;
                mostrarToast('✅ Materia agregada correctamente.');
                cargarMaterias();
            }).catch(err => {
                alert('❌ Error al agregar la materia: ' + err.message);
            });
        }

        function eliminarMateriaSistema(nombre) {
            if (!confirm(`¿Eliminar la materia "${nombre}"? Esta acción no elimina las notas ya registradas con este nombre.`)) return;

            const nuevaLista = MATERIAS_DISPONIBLES.filter(m => m !== nombre);
            MATERIAS_REF.set(nuevaLista).then(() => {
                MATERIAS_DISPONIBLES = nuevaLista;
                mostrarToast('🗑️ Materia eliminada correctamente.');
                cargarMaterias();
            }).catch(err => {
                alert('❌ Error al eliminar la materia: ' + err.message);
            });
        }

        function cargarUsuarios() {
            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;

            USUARIOS_REF.once('value').then(s => {
                const usuarios = s.val() || [];
                todosLosUsuarios = usuarios;
                usuariosFiltrados = [...usuarios];
                busquedaActualUsuarios = '';
                renderizarTablaUsuarios(usuariosFiltrados);
            }).catch(err => {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error al cargar usuarios: ${err.message}</div>`;
            });
        }

        function renderizarTablaUsuarios(usuarios) {
            const rolLabels = {
                'admin_principal': 'Admin Principal',
                'admin_secundario': 'Admin Secundario',
                'docente': 'Docente',
                'alumno': 'Alumno',
                'padre': 'Padre'
            };

            let html = `
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                    <h2><i class="bi bi-people"></i> Gestión de Usuarios</h2>
                    <button class="btn btn-primary" onclick="mostrarFormularioUsuario()">

                </div>
                <div class="row mb-3 align-items-center">
                    <div class="col-md-6">
                        <div class="buscador-container">
                            <i class="bi bi-search buscador-icono"></i>
                            <input type="text" class="form-control" id="buscadorUsuarios"
                                   placeholder="🔍 Buscar por DNI, nombre o apellido..."
                                   oninput="filtrarUsuarios(this.value)" autocomplete="off">
                            <i class="bi bi-x-circle buscador-limpiar" id="limpiarBuscadorUsuarios"
                                   onclick="limpiarBuscadorUsuarios()"></i>
                        </div>
                        ${busquedaActualUsuarios ? `
                            <div class="resultado-busqueda">
                                <i class="bi bi-search"></i> Resultados para: <strong>"${busquedaActualUsuarios}"</strong>
                                (${usuarios.length} encontrados)
                            </div>
                        ` : ''}
                    </div>
                    <div class="col-md-6 text-md-end mt-2 mt-md-0">
                        <span class="total-usuarios">
                            <i class="bi bi-person"></i> Total: <strong>${usuarios.length}</strong> usuarios
                        </span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover" id="tablaUsuarios">
                        <thead class="table-light">
                            <tr>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>DNI</th>
                                <th>Rol</th>
                                <th>Sede</th>
                                <th>Nivel</th>
                                <th>Grado</th>
                                <th>Sección</th>
                                <th>Materias</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaUsuarios">
            `;

            if (usuarios.length === 0) {
                html += `<tr><td colspan="10" class="text-center text-muted py-4">
                    ${busquedaActualUsuarios ? 'No se encontraron usuarios' : 'No hay usuarios registrados'}
                </td></tr>`;
            } else {
                usuarios.forEach((u, index) => {
                    const nombreMostrar = u.nombres || u.nombre || '-';
                    const materiasMostrar = (u.materias && u.materias.length > 0) ?
                        u.materias.slice(0, 3).join(', ') + (u.materias.length > 3 ? '...' : '') : '-';
                    html += `
                        <tr data-dni="${u.dni}" data-index="${index}">
                            <td><strong class="nombre-usuario-click" onclick="editarUsuario('${u.dni}')">${nombreMostrar}</strong></td>
                            <td>${u.apellidos || '-'}</td>
                            <td>${u.dni}</td>
                            <td><span class="badge bg-secondary">${rolLabels[u.rol] || u.rol}</span></td>
                            <td>${u.sede || '-'}</td>
                            <td>${u.nivel || '-'}</td>
                            <td>${u.grado || '-'}</td>
                            <td>${u.seccion || '-'}</td>
                            <td>${materiasMostrar}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="editarUsuario('${u.dni}')">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarUsuario('${u.dni}')">

                                </button>
                            </td>
                        </tr>

            html += `

                    </table>

            if (input) {
                input.value = busquedaActualUsuarios || '';
                const limpiarBtn = document.getElementById('limpiarBuscadorUsuarios');
                if (busquedaActualUsuarios) limpiarBtn.classList.add('visible');
                else limpiarBtn.classList.remove('visible');
                setTimeout(() => {
                    input.focus();
                    if (busquedaActualUsuarios) {
                        input.setSelectionRange(busquedaActualUsuarios.length, busquedaActualUsuarios.length);
                    }
                }, 50);
            }
        }

        function filtrarUsuarios(texto) {
            const busqueda = texto.trim();
            busquedaActualUsuarios = busqueda;
            const limpiarBtn = document.getElementById('limpiarBuscadorUsuarios');

            if (busqueda === '') {
                limpiarBtn.classList.remove('visible');
                usuariosFiltrados = [...todosLosUsuarios];
                renderizarTablaUsuarios(usuariosFiltrados);
                return;
            }

            limpiarBtn.classList.add('visible');
            const busquedaLower = busqueda.toLowerCase();
            usuariosFiltrados = todosLosUsuarios.filter(u => {
                const dni = (u.dni || '').toString().toLowerCase();
                const nombres = (u.nombres || u.nombre || '').toLowerCase();
                const apellidos = (u.apellidos || '').toLowerCase();
                const nombreCompleto = (nombres + ' ' + apellidos).toLowerCase();
                return dni.includes(busquedaLower) ||
                    nombres.includes(busquedaLower) ||
                    apellidos.includes(busquedaLower) ||
                    nombreCompleto.includes(busquedaLower);
            });
            renderizarTablaUsuarios(usuariosFiltrados);
        }

        function limpiarBuscadorUsuarios() {
            const input = document.getElementById('buscadorUsuarios');
            if (input) {
                input.value = '';
                busquedaActualUsuarios = '';
                document.getElementById('limpiarBuscadorUsuarios').classList.remove('visible');
                usuariosFiltrados = [...todosLosUsuarios];
                renderizarTablaUsuarios(usuariosFiltrados);
                input.focus();
            }
        }

        // ============================================
        // AÑADIR USUARIO
        // ============================================
        function mostrarFormularioUsuario() {
            const niveles = ['Primaria', 'Secundaria'];
            const grados = ['Primero', 'Segundo', 'Tercero', 'Cuarto', 'Quinto', 'Sexto'];

        function guardarUsuario(e) {
            e.preventDefault();
            const rol = document.getElementById('rol').value;
            const hijoDni = document.getElementById('hijo_dni').value.trim() || '';
            const materiasInput = document.getElementById('materias_nuevo');
            const materias = materiasInput ? materiasInput.value.split(',').map(m => m.trim()).filter(m => m) : [];

            if (rol === 'padre' && !hijoDni) {
                alert('❌ El padre debe tener el DNI de su hijo/hija');
                return;
            }

            const data = {
                nombres: document.getElementById('nombres').value.trim(),
                apellidos: document.getElementById('apellidos').value.trim(),
                nombre: document.getElementById('nombres').value.trim() + ' ' + document.getElementById('apellidos').value.trim(),
                dni: document.getElementById('dni').value.trim(),
                password: document.getElementById('dni').value.trim(),
                rol: rol,
                sede: document.getElementById('sede').value.trim() || 'VEGUETA',
                nivel: document.getElementById('nivel').value || '',
                grado: document.getElementById('grado').value || '',
                seccion: document.getElementById('seccion').value || '',
                edad: document.getElementById('edad').value || '',
                telefono_fijo: document.getElementById('telefono_fijo').value.trim() || '',
                telefono_movil: document.getElementById('telefono_movil').value.trim() || '',
                hijo_dni: hijoDni,
                materias: materias,
                esSuperAdmin: false,
                tipo_documento: 'DNI'
            };

            if (!data.nombres || !data.apellidos || !data.dni) {
                alert('❌ Nombres, Apellidos y DNI son obligatorios');
                return;
            }

            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                alert('❌ Error de conexión. Intenta recargar la página.');
                return;
            }

            USUARIOS_REF.once('value').then(s => {
                let usuarios = s.val() || [];
                if (usuarios.find(u => u.dni === data.dni)) {
                    alert('❌ DNI ya existe');
                    return;
                }
                usuarios.push(data);
                USUARIOS_REF.set(usuarios);
                alert('✅ Usuario creado. Contraseña: ' + data.dni);
                cargarUsuarios();
            }).catch(err => {
                alert('❌ Error al guardar: ' + err.message);
            });
        }

        function eliminarUsuario(dni) {

                alert('❌ Error de conexión');
                return;
            }
            USUARIOS_REF.once('value').then(s => {
                let usuarios = s.val() || [];
                usuarios = usuarios.filter(u => u.dni !== dni);
                USUARIOS_REF.set(usuarios);
                mostrarToast('Usuario eliminado correctamente');
                cargarUsuarios();
            }).catch(err => {
                alert('❌ Error: ' + err.message);
            });
        }

        function guardarAnuncio(e) {
            e.preventDefault();

            if (typeof ANUNCIOS_REF === 'undefined' || ANUNCIOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            const data = {
                id: generarId(),
                titulo: document.getElementById('titulo').value.trim(),
                contenido: document.getElementById('contenido').value.trim(),
                dirigido_a: document.getElementById('dirigido_a').value,
                creado_por: session.dni,
                fecha: new Date().toISOString(),
                activo: true
            };

            if (!data.titulo || !data.contenido) {
                alert('❌ Completa todos los campos');
                return;
            }

            ANUNCIOS_REF.once('value').then(s => {
                let anuncios = s.val() || [];
                anuncios.push(data);
                ANUNCIOS_REF.set(anuncios);
                mostrarToast('✅ Anuncio publicado');
                cargarAnuncios();
            }).catch(err => {
                alert('❌ Error: ' + err.message);
            });
        }

        function eliminarAnuncio(id) {
            if (!confirm('¿Eliminar este anuncio?')) return;
            if (typeof ANUNCIOS_REF === 'undefined' || ANUNCIOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            ANUNCIOS_REF.once('value').then(s => {
                let anuncios = s.val() || [];
                anuncios = anuncios.filter(a => a.id != id);
                ANUNCIOS_REF.set(anuncios);
                mostrarToast('Anuncio eliminado');
                cargarAnuncios();
            }).catch(err => {
                alert('❌ Error: ' + err.message);
            });
        }

        function toggleAnuncio(id) {
            if (typeof ANUNCIOS_REF === 'undefined' || ANUNCIOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            ANUNCIOS_REF.once('value').then(s => {
                let anuncios = s.val() || [];
                const index = anuncios.findIndex(a => a.id == id);
                if (index !== -1) {
                    anuncios[index].activo = !anuncios[index].activo;
                    ANUNCIOS_REF.set(anuncios);
                    mostrarToast(`Anuncio ${anuncios[index].activo ? 'mostrado' : 'ocultado'}`);
                    cargarAnuncios();
                }
            }).catch(err => {
                alert('❌ Error: ' + err.message);
            });
        }

            e.preventDefault();

                alert('❌ Error de conexión');
                return;
            }

            const fechas = {};
            const modulos = ['I', 'II', 'III', 'IV'];

            if (!confirm('⚠️ ¿Estás seguro de guardar estas fechas?\n\nLas fechas quedarán BLOQUEADAS para el Admin Secundario.')) {

            modulos.forEach(mod => {

                mostrarToast('✅ Fechas guardadas correctamente');
                cargarFechasModulos();

            const key = `${nivel}_${grado}_${seccion}`;

            const container = document.getElementById('horarioEditorContainer');
            container.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-primary"></div> Cargando horario...</div>`;

            const colorPrincipal = configuracionGlobal.colorPrincipal || '#044E4D';
            const colorSecundario = configuracionGlobal.colorSecundario || '#FDF6EC';

            HORARIOS_REF.child(key).once('value').then(s => {
                const data = s.val() || {};
                horariosCache[key] = data;
                if (!data._horas) horariosCache[key]._horas = [...HORAS_PREDEFINIDAS];
                renderizarEditorHorario(key, horariosCache[key], colorPrincipal, colorSecundario);
            }).catch(err => {
                container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
        }

        function renderizarEditorHorario(key, data, colorPrincipal, colorSecundario) {
            const nivel = document.getElementById('nivelHorarioSelect').value;
            const grado = document.getElementById('gradoHorarioSelect').value;
            const seccion = document.getElementById('seccionHorarioSelect').value;
            const container = document.getElementById('horarioEditorContainer');

            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            const horas = data._horas || [...HORAS_PREDEFINIDAS];

            let html = `
                <div class="card">
                    <div class="card-header" style="background-color:${colorPrincipal};color:white;display:flex;justify-content:space-between;align-items:center;">
                        <span><i class="bi bi-pencil"></i> Editando: ${nivel} - ${grado} "${seccion}"</span>
                        <div>
                            <button class="btn btn-sm btn-success" onclick="agregarFilaHorario('${key}')">
                                <i class="bi bi-plus-circle"></i> Agregar Fila
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="guardarHorarioEditado('${key}')">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0" style="overflow-x:auto;">
                        <table class="table table-bordered table-hover" style="margin:0;min-width:800px;">
                            <thead>
                                <tr>
                                    <th style="background-color:${colorPrincipal};color:white;padding:12px;min-width:120px;">
                                        Hora <span class="text-muted" style="font-weight:400;font-size:11px;color:rgba(255,255,255,0.7);">(clic para editar)</span>
                                    </th>
                                    ${dias.map(d => `<th style="background-color:${colorPrincipal};color:white;padding:12px;min-width:140px;">${d}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
            `;

            horas.forEach((hora, index) => {
                html += `<tr id="fila_${index}">
                    <td style="background-color:${colorPrincipal};color:#FDF6EC;font-weight:600;text-align:center;padding:10px;cursor:pointer;" 
                        onclick="editarHoraAdmin('${key}', ${index})">
                        ${hora}
                        <button class="btn-eliminar-fila" onclick="eliminarFilaHorario('${key}', ${index})" title="Eliminar esta hora">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </td>
                `;

                dias.forEach(dia => {
                    const clases = data[dia] || [];
                    const claseEnHora = clases.find(c => c.hora === hora);
                    const curso = claseEnHora?.curso || '';
                    const esRecreo = curso && curso.toUpperCase().trim() === 'RECREO';
                    let backgroundColor = colorSecundario;
                    let textoColor = colorPrincipal;
                    let claseExtra = '';
                    if (esRecreo) {
                        backgroundColor = '#d4edda';
                        textoColor = '#28a745';
                        claseExtra = 'celda-recreo';
                    }
                    html += `
                        <td style="background-color:${backgroundColor};padding:8px;text-align:center;vertical-align:middle;min-height:50px;" class="${claseExtra}">
                            ${curso ? (esRecreo ? `<div class="recreo">${curso}</div>` : `<div class="curso-simple" style="color:${textoColor};">${curso}</div>`) : '<span class="hora-vacio">—</span>'}
                        </td>
                    `;
                });

                html += `</tr>`;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center flex-wrap">
                        <div><span class="text-muted"><i class="bi bi-info-circle"></i> Haz clic en una hora para editarla</span></div>
                        <div>
                            <button class="btn btn-sm btn-success" onclick="agregarFilaHorario('${key}')">
                                <i class="bi bi-plus-circle"></i> Agregar Fila
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="guardarHorarioEditado('${key}')">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function agregarFilaHorario(key) {
            if (!horariosCache[key]) horariosCache[key] = { _horas: [...HORAS_PREDEFINIDAS] };
            const horas = horariosCache[key]._horas || [...HORAS_PREDEFINIDAS];
            const nuevaHora = prompt('Ingresa la nueva hora (ej: 10:00 - 11:00):');
            if (!nuevaHora || nuevaHora.trim() === '') return;
            if (horas.some(h => h === nuevaHora.trim())) {
                alert('❌ Esta hora ya existe.');
                return;
            }
            horas.push(nuevaHora.trim());
            horariosCache[key]._horas = horas;
            const colorPrincipal = configuracionGlobal.colorPrincipal || '#044E4D';
            const colorSecundario = configuracionGlobal.colorSecundario || '#FDF6EC';
            renderizarEditorHorario(key, horariosCache[key], colorPrincipal, colorSecundario);
            mostrarToast('✅ Fila agregada. No olvides guardar.');
        }

        function eliminarFilaHorario(key, index) {
            if (!horariosCache[key]) horariosCache[key] = { _horas: [...HORAS_PREDEFINIDAS] };
            const horas = horariosCache[key]._horas || [...HORAS_PREDEFINIDAS];
            if (index >= horas.length) return;
            const horaEliminar = horas[index];
            if (!confirm(`¿Eliminar la hora "${horaEliminar}" y todas sus clases?`)) return;
            horas.splice(index, 1);
            horariosCache[key]._horas = horas;
            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            dias.forEach(dia => {
                if (horariosCache[key][dia]) {
                    horariosCache[key][dia] = horariosCache[key][dia].filter(c => c.hora !== horaEliminar);
                }
            });
            const colorPrincipal = configuracionGlobal.colorPrincipal || '#044E4D';
            const colorSecundario = configuracionGlobal.colorSecundario || '#FDF6EC';
            renderizarEditorHorario(key, horariosCache[key], colorPrincipal, colorSecundario);
            mostrarToast('🗑️ Fila eliminada. No olvides guardar.');
        }

        function editarHoraAdmin(key, index) {
            if (!horariosCache[key]) horariosCache[key] = { _horas: [...HORAS_PREDEFINIDAS] };
            const horas = horariosCache[key]._horas || [...HORAS_PREDEFINIDAS];
            if (index >= horas.length) return;
            const horaActual = horas[index];
            const nuevaHora = prompt('Editar hora:', horaActual);
            if (nuevaHora === null) return;
            if (nuevaHora.trim() === '') {
                alert('❌ La hora no puede estar vacía.');
                return;
            }
            if (nuevaHora.trim() !== horaActual && horas.some(h => h === nuevaHora.trim())) {
                alert('❌ Esta hora ya existe.');
                return;
            }
            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            dias.forEach(dia => {
                if (horariosCache[key][dia]) {
                    horariosCache[key][dia].forEach(clase => {
                        if (clase.hora === horaActual) clase.hora = nuevaHora.trim();
                    });
                }
            });
            horas[index] = nuevaHora.trim();
            horariosCache[key]._horas = horas;
            const colorPrincipal = configuracionGlobal.colorPrincipal || '#044E4D';
            const colorSecundario = configuracionGlobal.colorSecundario || '#FDF6EC';
            renderizarEditorHorario(key, horariosCache[key], colorPrincipal, colorSecundario);
            mostrarToast('✅ Hora actualizada. No olvides guardar.');
        }

        function guardarHorarioEditado(key) {
            if (!horariosCache[key]) {
                alert('❌ No hay datos para guardar');
                return;
            }

            if (typeof HORARIOS_REF === 'undefined' || HORARIOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            const data = { _horas: horariosCache[key]._horas || [...HORAS_PREDEFINIDAS] };
            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            dias.forEach(dia => {
                if (horariosCache[key][dia] && horariosCache[key][dia].length > 0) {
                    data[dia] = horariosCache[key][dia].filter(c => c.curso && c.curso.trim() !== '');
                }
            });

            HORARIOS_REF.child(key).set(data).then(() => {
                mostrarToast('✅ Horario guardado correctamente en Firebase');
                localStorage.setItem('ultimoCambioHorario', Date.now().toString());
            }).catch(err => {
                alert('❌ Error al guardar: ' + err.message);
            });
        }

        // ============================================
        // CONFIGURACIÓN
        // ============================================

                    { valor: "'Impact', sans-serif", nombre: "Impact" },
                    { valor: "'Comic Sans MS', cursive", nombre: "Comic Sans MS" },
                    { valor: "'Poppins', sans-serif", nombre: "Poppins" },
                    { valor: "'Roboto', sans-serif", nombre: "Roboto" },
                    { valor: "'Open Sans', sans-serif", nombre: "Open Sans" },
                    { valor: "'Lato', sans-serif", nombre: "Lato" },
                    { valor: "'Montserrat', sans-serif", nombre: "Montserrat" },
                    { valor: "'Oswald', sans-serif", nombre: "Oswald" },

                    { valor: "'Playfair Display', serif", nombre: "Playfair Display" }

                const fuenteActual = config.fuente || "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";

                let html = `

                    </div>
                    <div class="card">

                            <form id="configForm" onsubmit="guardarConfiguracion(event)">

                                            <input type="color" class="color-picker" id="colorPrincipal" value="${config.colorPrincipal || '#044E4D'}">

                                    <input type="url" class="form-control" id="logoUrl" value="${config.logoUrl || ''}" placeholder="https://ejemplo.com/logo.png">

                                    </select>
                                    <div class="vista-previa-fuente" style="font-family: ${fuenteActual};">
                                        <strong>Vista previa:</strong> EDUNOVA - Sistema Escolar

                                </div>
                                <hr>
                                <div class="alert alert-info">
                                    <i class="bi bi-info-circle"></i>
                                    <strong>Nombres de los Módulos:</strong>
                                </div>
                                <div class="row">
                                    <div class="col-md-3">

                    `<div class="alert alert-danger">Error al cargar configuración: ${err.message}</div>`;

        function guardarConfiguracion(e) {
            e.preventDefault();

            if (typeof CONFIG_REF === 'undefined' || CONFIG_REF === null ||
                typeof NOMBRE_COLUMNAS_REF === 'undefined' || NOMBRE_COLUMNAS_REF === null ||
                typeof NOMBRES_MODULOS_REF === 'undefined' || NOMBRES_MODULOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            const color = document.getElementById('colorPrincipal').value;
            const colorSec = document.getElementById('colorSecundario').value;
            const logo = document.getElementById('logoUrl').value.trim();
            const titulo = document.getElementById('tituloColegio').value.trim();
            const fuente = document.getElementById('fuenteSelect').value;

            const nuevoEC = document.getElementById('nombreEC').value.trim() || 'EC';
            const nuevoEP = document.getElementById('nombreEP').value.trim() || 'EP';
            const nuevoED = document.getElementById('nombreED').value.trim() || 'ED';

            const moduloI = document.getElementById('nombreModuloI').value.trim() || 'Módulo I';
            const moduloII = document.getElementById('nombreModuloII').value.trim() || 'Módulo II';
            const moduloIII = document.getElementById('nombreModuloIII').value.trim() || 'Módulo III';
            const moduloIV = document.getElementById('nombreModuloIV').value.trim() || 'Módulo IV';

            const columnasData = { EC: nuevoEC, EP: nuevoEP, ED: nuevoED };
            const modulosData = { I: moduloI, II: moduloII, III: moduloIII, IV: moduloIV };
            const configData = {
                colorPrincipal: color,
                colorSecundario: colorSec,
                logoUrl: logo,
                tituloColegio: titulo,
                fuente: fuente
            };

            Promise.all([
                NOMBRE_COLUMNAS_REF.set(columnasData),
                NOMBRES_MODULOS_REF.set(modulosData),
                CONFIG_REF.update(configData)
            ]).then(() => {
                mostrarToast('Configuración guardada correctamente');
                document.documentElement.style.setProperty('--color-principal', color);
                document.documentElement.style.setProperty('--color-horario-principal', color);
                document.documentElement.style.setProperty('--color-horario-secundario', colorSec);
                const sidebar = document.getElementById('sidebarPrincipal');
                if (sidebar) sidebar.style.background = color;
                document.body.style.fontFamily = fuente;
                configuracionGlobal = {
                    colorPrincipal: color,
                    colorSecundario: colorSec,
                    logoUrl: logo,
                    tituloColegio: titulo,
                    fuente: fuente
                };
            }).catch(err => {
                alert('❌ Error al guardar: ' + err.message);
            });
        }
    </script>
    <script>
        // ============================================
        // PERMISOS
        // ============================================
        function cargarPermisos() {
            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null ||
                typeof PERMISOS_REF === 'undefined' || PERMISOS_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            Promise.all([
                USUARIOS_REF.once('value'),
                PERMISOS_REF.child('cambiar_contraseña').once('value')
            ]).then(([uSnap, pSnap]) => {
                const usuarios = uSnap.val() || [];
                permisosCache = pSnap.val() || {};
                todosLosAlumnosPermisos = usuarios.filter(u => u.rol === 'alumno');
                alumnosFiltradosPermisos = [...todosLosAlumnosPermisos];
                busquedaActualPermisos = '';
                renderizarTablaPermisos(alumnosFiltradosPermisos);
            }).catch(err => {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
        }

        function renderizarTablaPermisos(alumnos) {
            let html = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-shield-lock"></i> Gestión de Permisos</h2>
                    <span class="text-muted">Administra qué alumnos pueden cambiar su contraseña</span>
                </div>
                <div class="card">
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            <strong>Nota:</strong> Al autorizar a un alumno, podrá cambiar su contraseña desde su perfil.
                        </div>
                        <div class="row mb-3 align-items-center">
                            <div class="col-md-6">
                                <div class="buscador-container">
                                    <i class="bi bi-search buscador-icono"></i>
                                    <input type="text" class="form-control" id="buscadorPermisos"
                                           placeholder="🔍 Buscar por DNI o nombre..."
                                           oninput="filtrarPermisos(this.value)">
                                    <i class="bi bi-x-circle buscador-limpiar" id="limpiarBuscadorPermisos"
                                       onclick="limpiarBuscadorPermisos()"></i>
                                </div>
                                ${busquedaActualPermisos ? `
                                    <div class="resultado-busqueda">
                                        <i class="bi bi-search"></i> Resultados para: <strong>"${busquedaActualPermisos}"</strong>
                                        (${alumnos.length} encontrados)
                                    </div>
                                ` : ''}
                            </div>
                            <div class="col-md-6 text-md-end mt-2 mt-md-0">
                                <span class="total-usuarios">
                                    <i class="bi bi-person"></i> Total: <strong>${alumnos.length}</strong> alumnos
                                </span>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Alumno</th>
                                        <th>DNI</th>
                                        <th>Sede</th>
                                        <th>Permiso</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            if (alumnos.length === 0) {
                html += `<tr><td colspan="5" class="text-center text-muted py-4">
                    ${busquedaActualPermisos ? 'No se encontraron alumnos' : 'No hay alumnos registrados'}
                </td></tr>`;
            } else {
                alumnos.forEach(alumno => {
                    const tienePermiso = permisosCache[alumno.dni] === true;
                    html += `
                        <tr>
                            <td><strong>${alumno.nombres || alumno.nombre || '-'}</strong></td>
                            <td>${alumno.dni}</td>
                            <td>${alumno.sede || '-'}</td>
                            <td>
                                <span class="badge ${tienePermiso ? 'bg-success' : 'bg-secondary'}">
                                    ${tienePermiso ? '✅ Autorizado' : '❌ No autorizado'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm ${tienePermiso ? 'btn-danger' : 'btn-success'}"
                                        onclick="togglePermiso('${alumno.dni}', ${!tienePermiso})">
                                    ${tienePermiso ? '<i class="bi bi-x-circle"></i> Revocar' : '<i class="bi bi-check-circle"></i> Autorizar'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('contentArea').innerHTML = html;

            const input = document.getElementById('buscadorPermisos');
            if (input) {
                input.value = busquedaActualPermisos || '';
                const limpiarBtn = document.getElementById('limpiarBuscadorPermisos');
                if (busquedaActualPermisos) limpiarBtn.classList.add('visible');
                else limpiarBtn.classList.remove('visible');
                setTimeout(() => {
                    input.focus();
                    if (busquedaActualPermisos) {
                        input.setSelectionRange(busquedaActualPermisos.length, busquedaActualPermisos.length);
                    }
                }, 50);
            }
        }

        function filtrarPermisos(texto) {
            const busqueda = texto.trim();
            busquedaActualPermisos = busqueda;
            const limpiarBtn = document.getElementById('limpiarBuscadorPermisos');

            if (busqueda === '') {
                limpiarBtn.classList.remove('visible');
                alumnosFiltradosPermisos = [...todosLosAlumnosPermisos];
                renderizarTablaPermisos(alumnosFiltradosPermisos);
                return;
            }

            limpiarBtn.classList.add('visible');
            const busquedaLower = busqueda.toLowerCase();
            alumnosFiltradosPermisos = todosLosAlumnosPermisos.filter(u => {
                const dni = (u.dni || '').toString().toLowerCase();
                const nombre = (u.nombres || u.nombre || '').toLowerCase();
                return dni.includes(busquedaLower) || nombre.includes(busquedaLower);
            });
            renderizarTablaPermisos(alumnosFiltradosPermisos);
        }

        function limpiarBuscadorPermisos() {
            const input = document.getElementById('buscadorPermisos');
            if (input) {
                input.value = '';
                busquedaActualPermisos = '';
                document.getElementById('limpiarBuscadorPermisos').classList.remove('visible');
                alumnosFiltradosPermisos = [...todosLosAlumnosPermisos];
                renderizarTablaPermisos(alumnosFiltradosPermisos);
                input.focus();
            }
        }

        function togglePermiso(dni, autorizar) {
            if (!confirm(`¿${autorizar ? 'Autorizar' : 'Revocar'} el permiso?`)) return;

            if (typeof PERMISOS_REF === 'undefined' || PERMISOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            const ref = PERMISOS_REF.child('cambiar_contraseña').child(dni);
            if (autorizar) {
                ref.set(true);
                permisosCache[dni] = true;
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'cambio_permiso',
                        'media',
                        session.dni,
                        `Permiso de cambio de contraseña autorizado para DNI: ${dni}`,
                        { dni: dni, accion: 'autorizar' }
                    );
                }
                mostrarToast('✅ Permiso autorizado');
            } else {
                ref.remove();
                delete permisosCache[dni];
                if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                    AUDITORIA.registrar(
                        'cambio_permiso',
                        'media',
                        session.dni,
                        `Permiso de cambio de contraseña revocado para DNI: ${dni}`,
                        { dni: dni, accion: 'revocar' }
                    );
                }
                mostrarToast('✅ Permiso revocado');
            }
            renderizarTablaPermisos(alumnosFiltradosPermisos);
        }

            SOLICITUDES_REF.once('value').then(snapshot => {

                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="bi bi-file-earmark-text"></i> Solicitudes de Cambio de Contraseña</h2>

                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">

                                        <tr>
                                            <th>Alumno</th>
                                            <th>DNI</th>
                                            <th>Grado</th>
                                            <th>Correo del Padre</th>

                `;

                const keys = Object.keys(solicitudes);
                if (keys.length === 0) {
                    html += `<tr><td colspan="8" class="text-center text-muted py-4">No hay solicitudes registradas</td></tr>`;
                } else {
                    keys.sort((a, b) => new Date(solicitudes[b].fecha_solicitud) - new Date(solicitudes[a].fecha_solicitud));
                    keys.forEach(key => {
                        const s = solicitudes[key];
                        const estadoClase = {
                            'pendiente': 'pendiente',
                            'aprobado': 'aprobado',
                            'rechazado': 'rechazado'
                        };
                        const estadoTextos = {
                            'pendiente': '⏳ Pendiente',
                            'aprobado': '✅ Aprobado',
                            'rechazado': '❌ Rechazado'
                        };

                        html += `
                            <tr>
                                <td><strong>${s.alumno_nombre || '-'}</strong></td>
                                <td>${s.alumno_dni || '-'}</td>
                                <td>${s.grado || '-'}</td>
                                <td>${s.correo_padre || '-'}</td>
                                <td>${s.motivo || '-'}</td>
                                <td>${s.fecha ? new Date(s.fecha + 'T00:00:00').toLocaleDateString('es-ES') : '-'}</td>
                                <td><span class="estado-solicitud ${estadoClase[s.estado] || ''}">${estadoTextos[s.estado] || s.estado}</span></td>
                                <td>
                                    ${s.estado === 'pendiente' ? `

                                        </button>
                                        <button class="btn btn-sm btn-danger" onclick="rechazarSolicitud('${key}')">
                                            <i class="bi bi-x"></i>

                                        <button class="btn btn-sm btn-secondary" onclick="eliminarSolicitud('${key}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    `}
                                </td>
                            </tr>
                        `;
                    });
                }

                html += `
                                    </tbody>
                                </table>
                            </div>
                            <div class="mt-2">
                                <small class="text-muted">Total: <strong>${keys.length}</strong> solicitudes</small>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('contentArea').innerHTML = html;

                SOLICITUDES_REF.off();
                SOLICITUDES_REF.on('value', () => {
                    const active = document.querySelector('.nav-link.active');

                        cargarSolicitudes();

        function aprobarSolicitud(key) {
            if (!confirm('¿Aprobar esta solicitud?')) return;
            if (typeof SOLICITUDES_REF === 'undefined' || SOLICITUDES_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            SOLICITUDES_REF.child(key).update({ estado: 'aprobado' })
                .then(() => {
                    mostrarToast('✅ Solicitud aprobada.');
                    if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                        AUDITORIA.registrar(
                            'aprobacion_solicitud',
                            'media',
                            session.dni,
                            `Solicitud de cambio de contraseña aprobada para ${key}`,
                            { solicitud_id: key }
                        );
                    }
                    cargarSolicitudes();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function rechazarSolicitud(key) {
            if (!confirm('¿Rechazar esta solicitud?')) return;
            if (typeof SOLICITUDES_REF === 'undefined' || SOLICITUDES_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            SOLICITUDES_REF.child(key).update({ estado: 'rechazado' })
                .then(() => {
                    mostrarToast('❌ Solicitud rechazada.');
                    if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                        AUDITORIA.registrar(
                            'rechazo_solicitud',
                            'baja',
                            session.dni,
                            `Solicitud de cambio de contraseña rechazada para ${key}`,
                            { solicitud_id: key }
                        );
                    }
                    cargarSolicitudes();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function eliminarSolicitud(key) {
            if (!confirm('¿Eliminar esta solicitud?')) return;
            if (typeof SOLICITUDES_REF === 'undefined' || SOLICITUDES_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            SOLICITUDES_REF.child(key).remove()
                .then(() => {
                    mostrarToast('🗑️ Solicitud eliminada.');
                    cargarSolicitudes();
                })
                .catch(err => alert('Error: ' + err.message));

        function cargarAlumnosPorAula() {
            const nivel = document.getElementById('filtroNivelPago').value;
            const grado = document.getElementById('filtroGradoPago').value;
            const seccion = document.getElementById('filtroSeccionPago').value;

            const container = document.getElementById('contenedorPagosAula');
            container.innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2 text-muted">Cargando alumnos...</p>
                </div>
            `;

            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null ||
                typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                container.innerHTML = `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            Promise.all([
                USUARIOS_REF.once('value'),
                PAGOS_REF.once('value'),
                NOMBRES_MODULOS_REF ? NOMBRES_MODULOS_REF.once('value') : Promise.resolve({ val: () => ({ I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' }) })
            ]).then(([uSnap, pSnap, mSnap]) => {
                const usuarios = uSnap.val() || [];
                const pagos = pSnap.val() || {};
                pagosCache = pagos;
                const modulosData = mSnap.val() || { I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' };
                nombresModulosCache = modulosData;

                const alumnos = usuarios.filter(u =>
                    u.rol === 'alumno' &&
                    u.nivel === nivel &&
                    u.grado === grado &&
                    u.seccion === seccion
                );

                alumnosPorAulaCache = alumnos;

                if (alumnos.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-warning">
                            No hay alumnos en ${nivel} - ${grado} "${seccion}"
                        </div>
                    `;
                    return;
                }

                renderizarTablaPagosAula(alumnos, pagos, nivel, grado, seccion);
            }).catch(err => {
                container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            });
        }

        function renderizarTablaPagosAula(alumnos, pagos, nivel, grado, seccion) {
            const container = document.getElementById('contenedorPagosAula');
            const modulos = getNombresModulos();

            let moduloOptions = Object.keys(modulos).map(key =>
                `<option value="${key}">${modulos[key]}</option>`
            ).join('');

            let conceptosOptions = conceptosPagos.map(c =>
                `<option value="${c}">${c}</option>`
            ).join('');

            let totalPendiente = 0;
            let totalPagado = 0;
            let totalAlumnos = alumnos.length;
            let alumnosConPago = 0;

            alumnos.forEach(alumno => {
                const pagosAlumno = Object.keys(pagos).filter(key => pagos[key].alumno_dni === alumno.dni);
                if (pagosAlumno.length > 0) {
                    const pagosOrdenados = pagosAlumno.sort((a, b) => {
                        return new Date(pagos[b].fecha) - new Date(pagos[a].fecha);
                    });
                    const ultimoPago = pagos[pagosOrdenados[0]];
                    if (ultimoPago.estado === 'pendiente') {
                        totalPendiente += parseFloat(ultimoPago.monto) || 0;
                    } else if (ultimoPago.estado === 'pagado') {
                        totalPagado += parseFloat(ultimoPago.monto) || 0;
                        alumnosConPago++;
                    }
                }
            });

            let html = `
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="resumen-aula text-center">
                            <div class="numero">${totalAlumnos}</div>
                            <div class="label"><i class="bi bi-people"></i> Total Alumnos</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="resumen-aula text-center">
                            <div class="numero">${alumnosConPago}</div>
                            <div class="label"><i class="bi bi-check-circle text-success"></i> Con Pago al día</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="resumen-aula text-center">
                            <div class="numero" style="color: #856404;">${formatearMoneda(totalPendiente)}</div>
                            <div class="label"><i class="bi bi-clock text-warning"></i> Total Pendiente</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="resumen-aula text-center">
                            <div class="numero" style="color: #155724;">${formatearMoneda(totalPagado)}</div>
                            <div class="label"><i class="bi bi-check-circle text-success"></i> Total Pagado</div>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover pago-aula-tabla">
                        <thead>
                            <tr>
                                <th style="text-align:left;">Alumno</th>
                                <th>Concepto</th>
                                <th>Monto</th>
                                <th>Módulo</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            alumnos.forEach(alumno => {
                const pagosAlumno = Object.keys(pagos).filter(key => pagos[key].alumno_dni === alumno.dni);
                let ultimoPago = null;
                let pagoKey = null;

                if (pagosAlumno.length > 0) {
                    const pagosOrdenados = pagosAlumno.sort((a, b) => {
                        return new Date(pagos[b].fecha) - new Date(pagos[a].fecha);
                    });
                    pagoKey = pagosOrdenados[0];
                    ultimoPago = pagos[pagoKey];
                }

                const estadoActual = ultimoPago?.estado || 'pendiente';
                const montoActual = ultimoPago?.monto || 100;
                const conceptoActual = ultimoPago?.concepto || 'Pensión Mensual';
                const moduloActual = ultimoPago?.modulo || 'I';
                const fechaActual = ultimoPago?.fecha || getFechaHoy();

                const estadoClase = estadoActual === 'pagado' ? 'pagado' : 'pendiente';
                const estadoTexto = estadoActual === 'pagado' ? '✅ Pagado' : '⏳ Pendiente';

                let conceptosOptionsAlumno = conceptosPagos.map(c =>
                    `<option value="${c}" ${c === conceptoActual ? 'selected' : ''}>${c}</option>`
                ).join('');

                let moduloOptionsAlumno = Object.keys(modulos).map(key =>
                    `<option value="${key}" ${key === moduloActual ? 'selected' : ''}>${modulos[key]}</option>`
                ).join('');

                html += `
                    <tr id="fila_pago_${alumno.dni}">

                            <div class="alumno-nombre">${alumno.nombre || alumno.nombres}</div>
                            <div class="alumno-dni">DNI: ${alumno.dni}</div>
                        </td>
                        <td>
                            <select class="pago-concepto-select" id="concepto_${alumno.dni}">
                                ${conceptosOptionsAlumno}
                            </select>
                        </td>
                        <td>
                            <input type="number" class="pago-monto-input" id="monto_${alumno.dni}"
                                   value="${montoActual}" step="0.01" min="0">
                        </td>
                        <td>
                            <select class="pago-modulo-select" id="modulo_${alumno.dni}">
                                ${moduloOptionsAlumno}
                            </select>
                        </td>
                        <td>
                            <input type="date" class="pago-fecha-input" id="fecha_${alumno.dni}"
                                   value="${fechaActual}">
                        </td>

                            <button class="btn-estado-pago ${estadoClase}"
                                    id="btn_estado_${alumno.dni}"

                                ${estadoTexto}
                            </button>

                        <td>
                            <button class="btn-registrar-pago-aula success"
                                    onclick="registrarPagoAula('${alumno.dni}', '${pagoKey || ''}')">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            ${pagoKey ? `
                                <button class="btn-registrar-pago-aula danger"
                                        onclick="eliminarPagoAula('${pagoKey}', '${alumno.dni}')">
                                    <i class="bi bi-trash"></i>
                                </button>

                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <button class="btn btn-success" onclick="guardarPagosAula()">
                        <i class="bi bi-save"></i> Guardar Todos los Cambios
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        function toggleEstadoPago(alumnoDni, pagoKey) {
            const btn = document.getElementById(`btn_estado_${alumnoDni}`);
            if (!btn) return;

            const estadoActual = btn.classList.contains('pagado') ? 'pagado' : 'pendiente';
            const nuevoEstado = estadoActual === 'pagado' ? 'pendiente' : 'pagado';

            if (nuevoEstado === 'pagado') {
                btn.className = 'btn-estado-pago pagado';
                btn.textContent = '✅ Pagado';
            } else {
                btn.className = 'btn-estado-pago pendiente';
                btn.textContent = '⏳ Pendiente';
            }

            if (pagoKey && typeof PAGOS_REF !== 'undefined' && PAGOS_REF !== null) {
                PAGOS_REF.child(pagoKey).update({ estado: nuevoEstado })
                    .then(() => {
                        mostrarToast(`✅ Pago actualizado a ${nuevoEstado === 'pagado' ? 'PAGADO' : 'PENDIENTE'}`);
                        cargarAlumnosPorAula();
                    })
                    .catch(err => alert('Error: ' + err.message));
            } else {
                mostrarToast(`💰 Estado cambiado a ${nuevoEstado === 'pagado' ? 'PAGADO' : 'PENDIENTE'}`);
            }
        }

        function registrarPagoAula(alumnoDni, pagoKey) {
            const concepto = document.getElementById(`concepto_${alumnoDni}`).value;
            const monto = parseFloat(document.getElementById(`monto_${alumnoDni}`).value);
            const modulo = document.getElementById(`modulo_${alumnoDni}`).value;
            const fecha = document.getElementById(`fecha_${alumnoDni}`).value;
            const btnEstado = document.getElementById(`btn_estado_${alumnoDni}`);
            const estado = btnEstado.classList.contains('pagado') ? 'pagado' : 'pendiente';

            if (!monto || monto <= 0) {
                alert('❌ El monto debe ser mayor a 0.');
                return;
            }
            if (!fecha) {
                alert('❌ Debes seleccionar una fecha.');
                return;
            }
            if (!modulo) {
                alert('❌ Debes seleccionar un módulo.');
                return;
            }

            const alumno = alumnosPorAulaCache.find(a => a.dni === alumnoDni);
            if (!alumno) {
                alert('❌ Alumno no encontrado.');
                return;
            }

            const data = {
                alumno_dni: alumnoDni,
                alumno_nombre: alumno.nombre || alumno.nombres || 'Alumno',
                concepto: concepto,
                monto: monto,
                fecha: fecha,
                modulo: modulo,
                estado: estado,
                fecha_registro: new Date().toISOString(),
                creado_por: session.dni
            };

            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            if (pagoKey) {
                PAGOS_REF.child(pagoKey).update(data)
                    .then(() => {
                        mostrarToast('✅ Pago actualizado correctamente.');
                        if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                            AUDITORIA.registrar(
                                'edicion_pagos',
                                'media',
                                session.dni,
                                `Pago actualizado para ${alumno.nombre}`,
                                { alumno_dni: alumnoDni, monto: monto, modulo: modulo }
                            );
                        }
                        cargarAlumnosPorAula();
                    })
                    .catch(err => alert('Error: ' + err.message));
            } else {
                PAGOS_REF.push(data)
                    .then(() => {
                        mostrarToast('✅ Pago registrado correctamente.');
                        if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                            AUDITORIA.registrar(
                                'edicion_pagos',
                                'media',
                                session.dni,
                                `Nuevo pago registrado para ${alumno.nombre}`,
                                { alumno_dni: alumnoDni, monto: monto, modulo: modulo }
                            );
                        }
                        cargarAlumnosPorAula();
                    })
                    .catch(err => alert('Error: ' + err.message));
            }
        }

        function eliminarPagoAula(pagoKey, alumnoDni) {

            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(pagoKey).remove()
                .then(() => {
                    mostrarToast('🗑️ Pago eliminado.');
                    if (typeof AUDITORIA !== 'undefined' && AUDITORIA.registrar) {
                        AUDITORIA.registrar(
                            'eliminacion_pagos',
                            'alta',
                            session.dni,
                            `Pago eliminado para alumno DNI: ${alumnoDni}`,
                            { pago_id: pagoKey }
                        );
                    }
                    cargarAlumnosPorAula();
                })
                .catch(err => alert('Error: ' + err.message));
