            container.innerHTML = html;
        }

        function editarHora(key, index) {
            if (!horariosCache[key]) horariosCache[key] = { _horas: [...HORAS_PREDEFINIDAS] };
            const horas = horariosCache[key]._horas || [...HORAS_PREDEFINIDAS];
            if (index >= horas.length) return;
            const horaActual = horas[index];
            const nuevaHora = prompt('Ingresa la nueva hora (ej: 10:00 - 11:00):', horaActual);
            if (nuevaHora === null) return;
            if (nuevaHora.trim() === '') { alert('❌ La hora no puede estar vacía.'); return; }
            if (nuevaHora.trim() !== horaActual && horas.some(h => h === nuevaHora.trim())) {
                alert('❌ Esta hora ya existe en el horario.');
                return;
            }
            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            dias.forEach(dia => {
                if (horariosCache[key][dia]) {
                    horariosCache[key][dia].forEach(clase => {
                        if (clase.hora === horaActual) clase.hora = nuevaHora.trim();
                    });
                }
            });
            horas[index] = nuevaHora.trim();
            horariosCache[key]._horas = horas;
            renderizarEditorHorario(key, horariosCache[key]);
            mostrarToast('✅ Hora actualizada. No olvides guardar.');
        }

        function abrirEditorCelda(key, dia, hora, cursoActual, cellId) {
            const curso = prompt(`Día: ${dia}\n\nIngresa el nombre del curso (deja vacío para eliminar):`, cursoActual);
            if (curso === null) return;
            if (curso.trim() === '') {
                if (confirm(`¿Eliminar la clase en ${dia} ${hora}?`)) {
                    guardarCeldaHorarioSimple(key, dia, hora, '', cellId);
                }
                return;
            }
            guardarCeldaHorarioSimple(key, dia, hora, curso.trim(), cellId);
        }

        function guardarCeldaHorarioSimple(key, dia, hora, curso, cellId) {
            if (!horariosCache[key]) horariosCache[key] = {};
            if (!horariosCache[key][dia]) horariosCache[key][dia] = [];

            const clases = horariosCache[key][dia];
            const index = clases.findIndex(c => c.hora === hora);

            if (curso) {
                const nuevaClase = { curso, hora };
                if (index !== -1) {
                    clases[index] = nuevaClase;
                } else {
                    clases.push(nuevaClase);
                }
            } else {
                if (index !== -1) {
                    clases.splice(index, 1);
                }
            }

            const cell = document.getElementById(cellId);
            if (cell) {
                if (curso) {
                    cell.innerHTML = `<div class="celda-curso">${curso}</div>`;
                } else {
                    cell.innerHTML = `<span class="hora-vacio">—</span>`;
                }
            }
            mostrarToast(`✅ Clase ${curso || 'eliminada'} guardada en ${dia} ${hora}`);
        }

        function guardarHorario(key) {
            if (!horariosCache[key]) { alert('❌ No hay datos para guardar'); return; }
            if (typeof HORARIOS_REF === 'undefined' || HORARIOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            const data = { _horas: horariosCache[key]._horas || [...HORAS_PREDEFINIDAS] };
            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            dias.forEach(dia => {
                if (horariosCache[key][dia] && horariosCache[key][dia].length > 0) {
                    data[dia] = horariosCache[key][dia].filter(c => c.curso && c.curso.trim() !== '');
                }
            });

            HORARIOS_REF.child(key).set(data).then(() => {
                mostrarToast('✅ Horario guardado correctamente en Firebase');
                localStorage.setItem('ultimoCambioHorario', Date.now().toString());
            }).catch(err => alert('❌ Error al guardar: ' + err.message));
        }

        function limpiarHorario(key) {
            if (!confirm('¿Estás seguro de eliminar TODAS las clases de este horario?')) return;
            const dias = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            dias.forEach(dia => {
                if (horariosCache[key]) horariosCache[key][dia] = [];
            });
            renderizarEditorHorario(key, horariosCache[key] || {});
            mostrarToast('🗑️ Horario limpiado. No olvides guardar.');
        }

        // ===== PAGOS =====
        function cargarPagos() {
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null ||
                typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            Promise.all([PAGOS_REF.once('value'), USUARIOS_REF.once('value'), NOMBRES_MODULOS_REF ? NOMBRES_MODULOS_REF.once('value') : Promise.resolve({ val: () => ({ I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' }) })])
                .then(([pSnap, uSnap, mSnap]) => {
                    const pagos = pSnap.val() || {};
                    const usuarios = uSnap.val() || [];
                    const modulosData = mSnap.val() || { I: 'Módulo I', II: 'Módulo II', III: 'Módulo III', IV: 'Módulo IV' };
                    nombresModulosCache = modulosData;

                    let html = `
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2><i class="bi bi-credit-card"></i> Todos los Pagos</h2>
                            <button class="btn btn-secondary" onclick="cargarPagos()">
                                <i class="bi bi-arrow-repeat"></i> Actualizar
                            </button>
                        </div>
                        <div class="pago-filtros">
                            <input type="text" class="form-control" id="filtroAlumno"
                                   placeholder="🔍 Buscar por alumno..." oninput="filtrarPagosGlobal()">
                            <select class="form-select" id="filtroEstado" onchange="filtrarPagosGlobal()">
                                <option value="todos">Todos los estados</option>
                                <option value="pagado">✅ Pagado</option>
                                <option value="pendiente">⏳ Pendiente</option>
                                <option value="vencido">❌ Vencido</option>
                            </select>
                        </div>
                        <div id="listaPagosGlobal">
                    `;

                    const keys = Object.keys(pagos);
                    if (keys.length === 0) {
                        html += `<div class="alert alert-info">No hay pagos registrados.</div>`;
                    } else {
                        keys.sort((a, b) => new Date(pagos[b].fecha) - new Date(pagos[a].fecha));

                        let totalPendiente = 0;
                        let totalPagado = 0;

                        keys.forEach(key => {
                            const p = pagos[key];
                            const alumno = usuarios.find(u => u.dni === p.alumno_dni);
                            const nombreAlumno = alumno?.nombre || p.alumno_nombre || 'Alumno no encontrado';
                            const monto = parseFloat(p.monto) || 0;
                            const nombreModulo = modulosData[p.modulo] || p.modulo || 'Módulo';

                            if (p.estado === 'pendiente') totalPendiente += monto;
                            else if (p.estado === 'pagado') totalPagado += monto;

                            const estadoClase = p.estado || 'pendiente';
                            const estadoTexto = {
                                'pagado': '✅ Pagado',
                                'pendiente': '⏳ Pendiente',
                                'vencido': '❌ Vencido'
                            } [estadoClase] || estadoClase;

                            html += `
                                <div class="pago-card" data-alumno="${nombreAlumno.toLowerCase()}" data-estado="${estadoClase}">
                                    <div class="row align-items-center">
                                        <div class="col-md-3">
                                            <div class="pago-alumno">${nombreAlumno}</div>
                                            <div class="pago-concepto">${p.concepto || 'Sin concepto'}</div>
                                        </div>
                                        <div class="col-md-2">
                                            <div class="pago-monto">${formatearMoneda(monto)}</div>
                                            <div class="pago-fecha">📅 ${formatearFecha(p.fecha)}</div>
                                        </div>
                                        <div class="col-md-2">
                                            <span class="pago-modulo">📚 ${nombreModulo}</span>
                                        </div>
                                        <div class="col-md-2">
                                            <span class="pago-estado ${estadoClase}">${estadoTexto}</span>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="pago-acciones">
                                                ${estadoClase === 'pendiente' ? `
                                                    <button class="btn btn-sm btn-success" onclick="marcarPagoPagadoGlobal('${key}')">
                                                        <i class="bi bi-check-circle"></i> Pagar
                                                    </button>
                                                ` : ''}
                                                ${estadoClase === 'pagado' ? `
                                                    <button class="btn btn-sm btn-warning" onclick="marcarPagoPendienteGlobal('${key}')">
                                                        <i class="bi bi-arrow-counterclockwise"></i> Revertir
                                                    </button>
                                                ` : ''}
                                                <button class="btn btn-sm btn-danger" onclick="eliminarPagoGlobal('${key}')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                            <div class="row g-3 mt-3">
                                <div class="col-md-4">
                                    <div class="pago-resumen">
                                        <div class="icono"><i class="bi bi-clock"></i></div>
                                        <div class="numero">${formatearMoneda(totalPendiente)}</div>
                                        <div class="label">Total Pendiente</div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="pago-resumen">
                                        <div class="icono"><i class="bi bi-check-circle"></i></div>
                                        <div class="numero">${formatearMoneda(totalPagado)}</div>
                                        <div class="label">Total Pagado</div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="pago-resumen">
                                        <div class="icono"><i class="bi bi-wallet2"></i></div>
                                        <div class="numero">${formatearMoneda(totalPendiente + totalPagado)}</div>
                                        <div class="label">Total General</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                    document.getElementById('contentArea').innerHTML = html;
                }).catch(err => {
                    document.getElementById('contentArea').innerHTML =
                        `<div class="alert alert-danger">Error: ${err.message}</div>`;
                });
        }

        function filtrarPagosGlobal() {
            const filtroAlumno = document.getElementById('filtroAlumno').value.toLowerCase().trim();
            const filtroEstado = document.getElementById('filtroEstado').value;

            document.querySelectorAll('.pago-card').forEach(card => {
                const alumno = card.dataset.alumno || '';
                const estado = card.dataset.estado || '';
                let mostrar = true;
                if (filtroAlumno && !alumno.includes(filtroAlumno)) mostrar = false;
                if (filtroEstado !== 'todos' && estado !== filtroEstado) mostrar = false;
                card.style.display = mostrar ? 'block' : 'none';
            });
        }

        function marcarPagoPagadoGlobal(key) {
            if (!confirm('¿Marcar este pago como PAGADO?')) return;
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(key).update({ estado: 'pagado' })
                .then(() => {
                    mostrarToast('✅ Pago marcado como pagado.');
                    cargarPagos();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function marcarPagoPendienteGlobal(key) {
            if (!confirm('¿Revertir este pago a PENDIENTE?')) return;
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(key).update({ estado: 'pendiente' })
                .then(() => {
                    mostrarToast('🔄 Pago revertido a pendiente.');
                    cargarPagos();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function eliminarPagoGlobal(key) {
            if (!confirm('¿Eliminar este pago definitivamente?')) return;
            if (typeof PAGOS_REF === 'undefined' || PAGOS_REF === null) {
                alert('❌ Error de conexión');
                return;
            }

            PAGOS_REF.child(key).remove()
                .then(() => {
                    mostrarToast('🗑️ Pago eliminado.');
                    cargarPagos();
                })
                .catch(err => alert('Error: ' + err.message));
        }

        function formatearMoneda(monto) {
            if (monto === undefined || monto === null || isNaN(monto)) return 'S/ 0.00';
            return 'S/ ' + parseFloat(monto).toFixed(2);
        }

        function getColorClase(valor) {
            if (valor === '-' || isNaN(parseFloat(valor))) return 'sin-nota';
            const num = parseFloat(valor);
            if (num < 10.5) return 'rojo';
            return 'azul';
        }

        // ============================================
        // NAVEGACIÓN
        // ============================================
        document.querySelectorAll('[data-section]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('[data-section]').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                const section = this.dataset.section;

                switch(section) {
                    case 'users': cargarUsuarios(); break;
                    case 'promedios': cargarPromedios(); break;
                    case 'encuestas': cargarEncuestas(); break;
                    case 'fechas': cargarFechasModulos(); break;
                    case 'horarios': cargarHorariosAdmin(); break;
                    case 'pagos': cargarPagos(); break;
                    case 'kpi': cargarKPI(); break;
                    case 'ranking': cargarRanking(); break;
                    case 'reconocimientos': cargarReconocimientos(); break;
                    case 'reportes': cargarReportes(); break;
                    default: cargarUsuarios(); break;
                }
            });
        });

        // ============================================
        // CERRAR SESIÓN
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('session');
            window.location.href = 'index.html';
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        window.onload = function() {
            console.log('🚀 Ejecutando window.onload en admin-secundario.html...');

            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                console.error('❌ USUARIOS_REF no está definido');
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                return;
            }

            if (typeof cargarNombresModulos !== 'function') {
                console.error('❌ cargarNombresModulos no está definida');
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error: Funciones no cargadas correctamente</div>`;
                return;
            }

            Promise.all([
                cargarNombresModulos(),
                cargarNombreColumnas(),
                cargarMateriasCache()
            ]).then(() => {
                console.log('✅ Configuración cargada correctamente');
                cargarAlumnos().then(() => {
                    cargarUsuarios();
                    cargarKPI();
                    cargarRanking();
                    cargarReconocimientos();
                });
                console.log('✅ Admin Secundario iniciado correctamente');
            }).catch(err => {
                console.error('❌ Error al iniciar:', err);
                document.getElementById('contentArea').innerHTML =
                    `<div class="alert alert-danger">Error al iniciar: ${err.message}</div>`;
            });
        };

        setTimeout(function() {
            const contentArea = document.getElementById('contentArea');
            if (contentArea && (contentArea.innerHTML === 'Cargando...' || contentArea.innerHTML === '')) {
                console.log('🔄 Ejecutando fallback de inicialización...');
                if (typeof USUARIOS_REF !== 'undefined' && USUARIOS_REF !== null) {
                    cargarUsuarios();
                } else {
                    contentArea.innerHTML = `<div class="alert alert-danger">Error: Firebase no está disponible</div>`;
                }
            }
        }, 2000);

        console.log('✅ Script de admin-secundario cargado completamente');
    </script>
</body>
</html>
