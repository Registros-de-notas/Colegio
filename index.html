    <style>

    <script>

        // CONFIGURACIÓN DE FIREBASE

        const firebaseConfig = {
            apiKey: "AIzaSyAdL70mCS1oX3QigWl3dr1glvoUk7MOKzM",
            authDomain: "colegio-edunova.firebaseapp.com",
            databaseURL: "https://colegio-edunova-default-rtdb.firebaseio.com",
            projectId: "colegio-edunova",
            storageBucket: "colegio-edunova.firebasestorage.app",
            messagingSenderId: "350906702632",
            appId: "1:350906702632:web:dd0f3bd165842fe10de1d",
            measurementId: "G-6QKP7E3N97"
        };

        console.log('🚀 Iniciando Firebase...');

        // Inicializar Firebase
        try {
            if (firebase.apps && firebase.apps.length > 0) {
                console.log('🔥 Firebase ya estaba inicializado');
            } else {
                firebase.initializeApp(firebaseConfig);
                console.log('🔥 Firebase inicializado correctamente');
            }
        } catch (error) {
            console.error('❌ Error al inicializar:', error);
        }

        // Crear referencias
        const database = firebase.database();
        const USUARIOS_REF = database.ref('usuarios');
        const NOTAS_REF = database.ref('notas');
        const ASISTENCIAS_REF = database.ref('asistencias');
        const ANUNCIOS_REF = database.ref('anuncios');
        const CONFIG_REF = database.ref('configuracion');
        const FECHAS_REF = database.ref('fechasModulos');
        const NOMBRE_COLUMNAS_REF = database.ref('nombreColumnas');
        const NOMBRES_MODULOS_REF = database.ref('nombresModulos');
        const PERMISOS_REF = database.ref('permisos');
        const HORARIOS_REF = database.ref('horarios');
        const ENCUESTAS_REF = database.ref('encuestas_docentes');
        const PAGOS_REF = database.ref('pagos');
        const SOLICITUDES_REF = database.ref('solicitudes_cambio_contraseña');
        const AUDITORIA_REF = database.ref('auditoria');
        const EVOLUCION_REF = database.ref('evolucion_alumnos');

        // Hacer disponibles globalmente
        window.USUARIOS_REF = USUARIOS_REF;
        window.NOTAS_REF = NOTAS_REF;
        window.ASISTENCIAS_REF = ASISTENCIAS_REF;
        window.ANUNCIOS_REF = ANUNCIOS_REF;
        window.CONFIG_REF = CONFIG_REF;
        window.FECHAS_REF = FECHAS_REF;
        window.NOMBRE_COLUMNAS_REF = NOMBRE_COLUMNAS_REF;
        window.NOMBRES_MODULOS_REF = NOMBRES_MODULOS_REF;
        window.PERMISOS_REF = PERMISOS_REF;
        window.HORARIOS_REF = HORARIOS_REF;
        window.ENCUESTAS_REF = ENCUESTAS_REF;
        window.PAGOS_REF = PAGOS_REF;
        window.SOLICITUDES_REF = SOLICITUDES_REF;
        window.AUDITORIA_REF = AUDITORIA_REF;
        window.EVOLUCION_REF = EVOLUCION_REF;

        console.log('✅ Referencias creadas:');
        console.log('  - USUARIOS_REF:', typeof USUARIOS_REF);
        console.log('  - CONFIG_REF:', typeof CONFIG_REF);

        // Verificar conexión en tiempo real
        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            const estadoEl = document.getElementById('estadoConexionLogin');
            if (snap.val() === true) {
                console.log('✅ Conectado a Firebase');
                if (estadoEl) {
                    estadoEl.textContent = '✅ Conectado';
                    estadoEl.className = 'conectado';
                }
                const errorDiv = document.getElementById('loginError');
                if (errorDiv) errorDiv.style.display = 'none';
            } else {
                console.warn('⚠️ Desconectado de Firebase');
                if (estadoEl) {
                    estadoEl.textContent = '❌ Desconectado';
                    estadoEl.className = 'desconectado';
                }
            }
        });

        console.log('✅ firebase-config.js cargado correctamente');
    </script>
    
    <style>
        :root { --color-principal: #044E4D; --color-secundario: #FDF6EC; }
        body {
            background: linear-gradient(135deg, var(--color-principal), var(--color-secundario));
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);

        }

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <div id="logoContainer"><span class="logo"></span></div>
                    <h3 id="tituloColegio">EDUNOVA</h3>
                    <p class="subtitle">Inicia sesión con tus credenciales</p>
                    
                    <div id="estadoConexionLogin" class="cargando">⏳ Conectando a Firebase...</div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person"></i> Usuario</label>
                            <input type="text" class="form-control input-mayuscula" id="inputUsuario" placeholder="" autocomplete="off">

                        </div>

                            <span id="errorMessage">Datos incorrectos</span>

    </div>
    <script>
        // ============================================
        // FUNCIÓN: CAPITALIZAR CADA PALABRA
        // ============================================
        function capitalizarPalabras(texto) {
            return texto.split(' ').map(palabra => {
                if (palabra.length === 0) return '';
                return palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();
            }).join(' ');
        }

        document.getElementById('inputUsuario').addEventListener('input', function(e) {
            const texto = this.value;
            const textoCapitalizado = capitalizarPalabras(texto);
            if (texto !== textoCapitalizado) {
                this.value = textoCapitalizado;
                this.setSelectionRange(this.value.length, this.value.length);
            }
        });

        // ============================================
        // FUNCIÓN: QUITAR ACENTOS
        // ============================================
        function quitarAcentos(texto) {
            if (!texto) return '';
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        // ============================================
        // NORMALIZAR TEXTO
        // ============================================
        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        // ============================================
        // VERIFICAR SI TIENE NOMBRE Y APELLIDO
        // ============================================
        function tieneNombreYApellido(texto) {
            const partes = texto.trim().split(/\s+/);
            return partes.length >= 2;
        }

        // ============================================
        // APLICAR CONFIGURACIÓN
        // ============================================
        function aplicarConfiguracion(config) {
            config = config || {};
            if (config.colorPrincipal) {
                document.documentElement.style.setProperty('--color-principal', config.colorPrincipal);
                document.documentElement.style.setProperty('--color-secundario', config.colorSecundario || '#2e86c1');
            }
            if (config.fuente) { document.body.style.fontFamily = config.fuente; }
            if (config.tituloColegio) {
                document.getElementById('tituloColegio').textContent = config.tituloColegio;
                document.getElementById('footerTexto').textContent = config.tituloColegio;
                document.title = config.tituloColegio;
            }
            const logoContainer = document.getElementById('logoContainer');
            if (config.logoUrl && config.logoUrl.trim() !== '') {
                logoContainer.innerHTML = `<img src="${config.logoUrl}" alt="Logo" class="logo-colegio-login" onerror="this.style.display='none';">`;
            } else {
                logoContainer.innerHTML = `<span class="logo"></span>`;
            }
        }

        function cargarConfiguracion() {
            if (typeof CONFIG_REF === 'undefined' || CONFIG_REF === null) {
                console.error('❌ CONFIG_REF no está definido');
                return;
            }
            CONFIG_REF.once('value').then(snapshot => {
                const config = snapshot.val() || {};
                aplicarConfiguracion(config);
            }).catch(err => {
                console.error('Error cargando configuración:', err);
            });
        }
    </script>
</body>
</html>
    <script>
        // ============================================
        // FUNCIÓN DE LOGIN CON VERIFICACIÓN DE ACCESO
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('inputUsuario').value.trim();
            const clave = document.getElementById('inputClave').value.trim();
            const errorDiv = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');
            const btn = document.getElementById('btnLogin');
            
            // Verificar que Firebase esté cargado
            if (typeof USUARIOS_REF === 'undefined' || USUARIOS_REF === null) {
                errorDiv.style.display = 'block';
                errorMsg.textContent = '❌ Firebase no está cargado. Recarga la página.';
                return;
            }

            if (!usuario || !clave) {
                errorDiv.style.display = 'block';
                errorMsg.textContent = '⚠️ Completa todos los campos';
                return;
            }

            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Verificando...';
            btn.disabled = true;
            errorDiv.style.display = 'none';

            // Usar async/await para manejar la verificación de acceso
            (async function realizarLogin() {
                try {
                    const snapshot = await USUARIOS_REF.once('value');
                    const usuarios = snapshot.val() || [];
                    let user = null;

                    const usuarioNormalizado = normalizarTexto(usuario);

                    // 1. ADMIN PRINCIPAL (DNI + DNI)
                    if (!user) {
                        user = usuarios.find(u => 
                            u.dni === usuario && 
                            u.password === clave && 
                            u.rol === 'admin_principal'
                        );
                    }

                    // 2. ADMIN SECUNDARIO (DNI + DNI)
                    if (!user) {
                        user = usuarios.find(u => 
                            u.dni === usuario && 
                            u.password === clave && 
                            u.rol === 'admin_secundario'
                        );
                    }

                    // 3. PADRE (DNI del padre + DNI del hijo)
                    if (!user) {
                        user = usuarios.find(u => 
                            u.dni === usuario && 
                            u.hijo_dni === clave && 
                            u.rol === 'padre'
                        );
                    }

                    // 4. DOCENTE (Nombre Completo + DNI)
                    if (!user) {
                        if (!tieneNombreYApellido(usuario)) {
                            errorDiv.style.display = 'block';
                            errorMsg.textContent = '⚠️ Los docentes deben ingresar su nombre completo';
                            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
                            btn.disabled = false;
                            return;
                        }
                        
                        user = usuarios.find(u => {
                            if (u.rol !== 'docente') return false;
                            if (u.password !== clave) return false;
                            const nombreBD = normalizarTexto(u.nombre || u.nombres || '');
                            return nombreBD === usuarioNormalizado;
                        });
                    }

                    // 5. ALUMNO (Nombre Completo + DNI)
                    if (!user) {
                        if (!tieneNombreYApellido(usuario)) {
                            errorDiv.style.display = 'block';
                            errorMsg.textContent = '⚠️ Los alumnos deben ingresar su nombre completo';
                            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
                            btn.disabled = false;
                            return;
                        }
                        
                        user = usuarios.find(u => {
                            if (u.rol !== 'alumno') return false;
                            if (u.password !== clave) return false;
                            const nombreBD = normalizarTexto(u.nombre || u.nombres || '');
                            return nombreBD === usuarioNormalizado;
                        });
                    }

                    if (!user) {
                        errorDiv.style.display = 'block';
                        errorMsg.textContent = '❌ Credenciales incorrectas. Verifica tus datos.';
                        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
                        btn.disabled = false;
                        return;
                    }

                    // ============================================
                    // VERIFICAR ACCESO POR ROL (CORREGIDO)
                    // ============================================
                    // El admin principal SIEMPRE tiene acceso
                    if (user.rol !== 'admin_principal') {
                        try {
                            // Verificar si CONFIG_REF está disponible
                            if (typeof CONFIG_REF !== 'undefined' && CONFIG_REF !== null) {
                                const accesosRef = CONFIG_REF.child('accesos');
                                const accesoSnap = await accesosRef.child(user.rol).once('value');
                                const tieneAcceso = accesoSnap.val();
                                
                                // Si el valor es false, está bloqueado
                                // Si es undefined o null, por defecto está permitido (true)
                                if (tieneAcceso === false) {
                                    errorDiv.style.display = 'block';
                                    errorMsg.textContent = '    En mantenimiento ó consulte con administración.';
                                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
                                    btn.disabled = false;
                                    return;
                                }
                            } else {
                                console.warn('⚠️ CONFIG_REF no disponible, permitiendo acceso por defecto');
                            }
                        } catch (error) {
                            console.warn('⚠️ Error verificando acceso:', error);
                            // Si hay error, permitir acceso por defecto
                        }
                    } else {
                        console.log('✅ Admin Principal - Acceso garantizado');
                    }

                    // Crear sesión
                    const session = {
                        dni: user.dni,
                        nombre: user.nombre || user.nombres || '',
                        rol: user.rol,
                        grado: user.grado || '',
                        seccion: user.seccion || '',
                        nivel: user.nivel || '',
                        materias: user.materias || [],
                        hijo_dni: user.hijo_dni || '',
                        esSuperAdmin: user.esSuperAdmin || false,
                        sede: user.sede || '',
                        password: user.password || ''
                    };
                    sessionStorage.setItem('session', JSON.stringify(session));

                    // Registrar login exitoso en auditoría
                    if (typeof window.AUDITORIA !== 'undefined' && window.AUDITORIA.registrar) {
                        window.AUDITORIA.registrar(
                            'login_exitoso',
                            'baja',
                            session.dni,
                            `Inicio de sesión exitoso como ${session.rol}`,
                            { rol: session.rol }
                        );
                    }

                    const roles = {
                        'admin_principal': 'admin-principal.html',
                        'admin_secundario': 'admin-secundario.html',
                        'docente': 'docente.html',
                        'alumno': 'alumno.html',
                        'padre': 'padre.html'
                    };
                    
                    console.log('✅ Login exitoso:', user.nombre || user.nombres, '→', user.rol);
                    
                    window.location.href = roles[user.rol] || 'index.html';

                } catch (error) {
                    console.error('Error en login:', error);
                    errorDiv.style.display = 'block';
                    errorMsg.textContent = '❌ Error al conectar con Firebase: ' + error.message;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Ingresar';
                    btn.disabled = false;
                }
            })();
        });
    </script>
</body>
</html>
    <script>
        // ============================================
        // PERMITIR ENTER PARA ENVIAR
        // ============================================
        document.getElementById('inputClave').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        document.getElementById('inputUsuario').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('inputClave').focus();
            }
        });

        // ============================================
        // INICIALIZAR
        // ============================================
        window.onload = function() {
            // Verificar si Firebase está disponible
            if (typeof CONFIG_REF !== 'undefined' && CONFIG_REF !== null) {
                cargarConfiguracion();
            } else {
                console.warn('⚠️ CONFIG_REF no disponible');
            }
            
            console.log('✅ Sistema Escolar - Login');
            document.getElementById('inputUsuario').focus();
            
            // Verificar sesión activa
            const session = JSON.parse(sessionStorage.getItem('session') || 'null');
            if (session) {
                const roles = {
                    'admin_principal': 'admin-principal.html',
                    'admin_secundario': 'admin-secundario.html',
                    'docente': 'docente.html',
                    'alumno': 'alumno.html',
                    'padre': 'padre.html'
                };
                if (roles[session.rol]) {
                    window.location.href = roles[session.rol];
                }
            }
        };
    </script>
</body>
